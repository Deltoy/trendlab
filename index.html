<meta charset="utf-8">

<title>레디영 트렌드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>:root{color-scheme:light;
  --bg:#fafaf8;--card:#fff;--line:#ececec;--line2:#e2e2df;
  --ink:#111111;--ink2:#6b6b6b;--muted:#8a8a8a;
  --good:#16a34a;--good-soft:#dcfce7;--bad:#b42318;--bad-soft:#fee4e2;
  --warn:#9a5b1f;--warn-soft:#f6ece0;
  --pink:#f6d5d8;--sage:#d6ddd3;--neutral:#f5f5f5;
  --act:#111111;--good-ink:#16a34a;
  --radius:20px;--radius-sm:14px;--radius-thumb:12px;--pill:999px;
  --shadow:0 4px 24px rgba(0,0,0,.04);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;word-break:keep-all}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.97)}

/* ── 상단 바 ── */
.topbar{position:sticky;top:0;z-index:20;background:rgba(250,250,248,.92);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:20px;padding:10px 24px}
.logo{display:flex;align-items:center;gap:8px;flex:none}
.logo-mark{width:28px;height:28px;border-radius:9px;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.logo-text{font-size:17px;font-weight:800;letter-spacing:-.02em}
.logo-pill{font-size:11px;font-weight:600;color:var(--ink2);background:var(--neutral);border-radius:var(--pill);padding:2px 9px}
.tabs{display:flex;gap:4px;flex:1;justify-content:center}
.tabs button{min-height:44px;border:0;background:transparent;border-bottom:2px solid transparent;font-size:14.5px;color:var(--ink2);font-weight:500;padding:0 12px}
.tabs button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}
.topsearch-wrap{flex:none;width:260px}
.topsearch{width:100%;height:44px;border:1px solid var(--line2);border-radius:var(--pill);padding:0 16px;font-size:14px;background:#fff}
.topsearch:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.status{max-width:1400px;margin:12px auto 0;padding:0 24px;font-size:13px;color:var(--ink2)}
.status.bad{margin:12px 16px 0;padding:10px 14px;border-radius:var(--radius-sm);background:var(--bad-soft);color:var(--bad);font-weight:600}
@media(min-width:900px){.status.bad{margin:12px auto 0;max-width:1352px}}
.status.first{color:var(--ink2)}

/* ── 레이아웃: 좌측 필터 + 본문 ── */
.layout{max-width:1400px;margin:0 auto;padding:16px 24px 80px}
@media(min-width:900px){.layout{display:grid;grid-template-columns:1fr;gap:20px}}
@media(min-width:1100px){.layout{grid-template-columns:220px 1fr}}
.filter-col{display:none}
.filter-mobile{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:0 16px 10px;margin:0 -16px}
.filter-mobile::-webkit-scrollbar{display:none}
.filter-mobile .chip{flex:none}
@media(min-width:900px){
  .filter-mobile{display:none}
  .filter-col{display:block}
}
@media(min-width:1100px){
  .filter-col{position:sticky;top:76px;align-self:start;max-height:calc(100vh - 96px);overflow-y:auto}
}
.filter-sec{margin-bottom:20px}
.filter-sec h3{margin:0 0 8px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.filter-cats{display:flex;flex-direction:column;gap:2px}
.filter-cat{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:44px;padding:0 10px;border:0;border-radius:12px;background:transparent;font-size:13.5px;color:var(--ink);text-align:left}
.filter-cat b{font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.filter-cat:hover{background:var(--neutral)}
.filter-pills{display:flex;flex-wrap:wrap;gap:6px}
.filter-period{margin-top:2px}

.filter-report p{margin:0 0 10px;font-size:13px;color:var(--ink)}
.filter-report .btn{width:100%}
main{min-width:0}
.view{display:none}.view.on{display:block}
#home{display:none}#home.on{display:flex;flex-direction:column;gap:20px}

/* ── 카드 ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;min-width:0;box-shadow:var(--shadow);transition:transform .15s ease}
.card:hover{transform:translateY(-2px)}
.card.flat{background:var(--card);padding:16px 20px}
.card.flat h2{font-size:14px}
.step{min-width:0}
.step-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px}
.step-num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.step-head-tx{min-width:0}
.step-head h2{margin:0;font-size:19px;font-weight:700;letter-spacing:-.02em}
.step-sub-line{margin:2px 0 0;font-size:12px;color:var(--muted);font-weight:500}
.step-hero{padding:20px}
.step-flat{background:var(--card)}
.step1-status{margin:0 0 12px;font-size:12.5px;color:var(--ink2)}
.step1-report .rp-head{font-size:22px!important;margin:0 0 8px!important}
.mini-viz{margin-top:16px;max-width:280px}
.mini-viz .vz-donut{gap:10px}
.mini-viz .vz-donut svg{width:64px;height:64px}
.mini-viz .vz-legend{font-size:11.5px}
.mini-bars{margin:8px 0 12px}
.mini-bars .vz-row{min-height:22px;font-size:11.5px}
.mini-bars .vz-track{height:8px}
.step2-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media(min-width:900px){.step2-grid{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}}
.step2-left,.step2-right{min-width:0}
.step2-right{display:flex;flex-direction:column;gap:16px}
.step5-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;margin-top:16px}
@media(min-width:900px){.step5-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.move-body{margin-top:8px}
.card h2{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em}
.card .sub{margin:2px 0 8px;font-size:12.5px;color:var(--muted)}
.card .wait{margin:8px 0 0;padding:16px;border-radius:var(--radius-sm);background:var(--neutral);color:var(--ink2);font-size:13.5px;text-align:center}
.card .empty{margin:8px 0 0;color:var(--muted);font-size:13.5px}
.more{margin-top:4px;min-height:44px;width:100%;border:0;background:transparent;color:var(--ink);font-weight:600;font-size:14px}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 0;border:0;border-top:1px solid var(--line);background:transparent;text-align:left}
.card .row:first-of-type{border-top:0}
.row .rk{flex:none;width:36px;font-size:17px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums}
.row .rk small{font-size:11px;font-weight:400;color:var(--ink2)}
.row img,.row .noimg,.thumb{flex:none;width:48px;height:48px;border-radius:var(--radius-thumb);object-fit:contain;background:#fff;border:1px solid var(--line)}
.row .noimg,.thumb,span.thumb{background:linear-gradient(135deg,#f1f1f3,#e6e6ea)}
.row .tx{flex:1;min-width:0}
.row .br{display:block;font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm{font-size:14.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.row .pr{display:block;margin-top:2px;font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.row .pr b{color:var(--ink);font-weight:600}
.row .pr .dc{color:var(--warn);margin-left:4px}
.row .side{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px;max-width:92px}
.val{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.val.up{color:var(--good)}.val.down{color:var(--bad)}
.row .val.up,.row .val.down,.flow .val.up,.flow .val.down{padding:1px 7px;border-radius:var(--pill)}
.row .val.up,.flow .val.up{background:var(--good-soft)}
.row .val.down,.flow .val.down{background:var(--bad-soft)}
.own{font-size:12px;font-weight:600;line-height:18px;padding:1px 8px;border-radius:var(--pill);white-space:nowrap}
.own.y{background:transparent;color:var(--good-ink);font-weight:400}.own.n{background:var(--warn-soft);color:var(--warn)}
.flags{display:flex;gap:4px;margin-top:4px}
.flags span{font-size:12px;padding:1px 7px;border-radius:var(--pill);background:var(--neutral);color:var(--ink2)}
.mv{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.mv.up{color:var(--good)}.mv.down{color:var(--bad)}.mv.new{color:#fff;background:var(--ink);padding:1px 8px;border-radius:var(--pill);font-size:12px}
.flow{display:grid;gap:6px;margin-top:8px}
.flow div{display:flex;justify-content:space-between;font-size:14px;padding:6px 0;border-top:1px solid var(--line)}
.flow div:first-child{border-top:0}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.kpis div{background:var(--neutral);border-radius:var(--radius-sm);padding:12px}
.kpis b{display:block;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.kpis span{font-size:12px;color:var(--ink2)}
.rank-head{position:sticky;top:var(--top-h,66px);z-index:10;background:var(--bg);padding:4px 0 8px}
.chips{display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:8px}
.chips::-webkit-scrollbar{display:none}
@media(min-width:900px){.chips{flex-wrap:wrap;overflow:visible}}
.chip{flex:none;min-height:44px;padding:0 16px;border-radius:var(--pill);border:1px solid var(--line2);background:#fff;font-size:14px}
.chip.on{border-color:var(--ink);background:var(--ink);color:#fff;font-weight:600}
.seg{display:flex;gap:4px;background:var(--neutral);border-radius:14px;padding:3px}
.seg button{flex:1;min-height:44px;border:0;border-radius:11px;background:transparent;font-size:14px;color:#515154}
.seg button.on{background:#111;color:#fff;font-weight:600}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:4px 16px;box-shadow:var(--shadow)}
.list .row:first-child{border-top:0}
.msg{padding:32px 12px;text-align:center;color:var(--ink2);font-size:14px}
.dim{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.dim.on{opacity:1;pointer-events:auto}
.sheet{visibility:hidden;position:fixed;left:0;right:0;bottom:0;z-index:41;background:#fff;border-radius:20px 20px 0 0;max-height:92vh;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1),visibility 0s .25s;max-width:640px;margin:0 auto}
.sheet.on{transform:none;visibility:visible;transition-delay:0s}
@media(min-width:900px){.sheet{bottom:auto;top:50%;border-radius:20px;transform:translateY(-40%);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}.sheet.on{transform:translateY(-50%);opacity:1;pointer-events:auto}}
.sheet-head{flex:none;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
.sheet-head b{font-size:17px;font-weight:700}
.close{min-height:44px;padding:0 16px;border:0;border-radius:var(--pill);background:var(--neutral);font-size:14px}
.sheet-body{flex:1;min-height:0;overflow:auto;padding:16px;overscroll-behavior:contain}
.pd-top{display:flex;gap:16px;align-items:flex-start}
.pd-top img,.pd-top .noimg{flex:none;width:112px;height:112px;border-radius:16px;object-fit:contain;border:1px solid var(--line);background:#fff}
.pd-top .noimg{background:linear-gradient(135deg,#f1f1f3,#e6e6ea)}
.pd-top .br{font-size:13px;color:var(--ink2)}
.pd-top h3{margin:2px 0 6px;font-size:17px;font-weight:700;line-height:1.35;overflow-wrap:anywhere}
.pd-sec{margin-top:20px}
.pd-sec h4{margin:0 0 8px;font-size:14px;font-weight:600;color:var(--ink2)}
.facts{display:flex;gap:16px;font-size:13px;color:var(--ink2)}
.facts b{color:var(--ink);font-weight:600}
.chart{max-width:440px}.chart svg{width:100%;height:auto;max-height:190px;display:block}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--ink2);margin-top:4px}
.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;vertical-align:middle;margin-right:4px}
.link-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.link-row:first-child{border-top:0}
.link-row span{flex:1;min-width:0;overflow-wrap:anywhere}
.btn{min-height:44px;padding:0 14px;border-radius:var(--pill);border:1px solid var(--line2);background:#fff;font-size:14px;white-space:nowrap}
.btn.pri{border:0;background:var(--ink);color:#fff;font-weight:600}
.btn.danger{color:var(--bad)}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:var(--ink)}
.field{display:block;margin-bottom:8px}
.field textarea,.field input{width:100%;border:1px solid var(--line2);border-radius:var(--radius-sm);padding:10px 12px;font-size:16px;background:#fff;min-height:44px}
.field textarea{min-height:72px;resize:vertical}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.grp{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:12px;box-shadow:var(--shadow)}
.grp h2{margin:0 0 4px;font-size:17px;font-weight:700;overflow-wrap:anywhere}
.grp .memo{font-size:13px;color:var(--ink);margin-top:2px}
.grp .logi{display:block;font-size:12px;color:var(--good-ink);margin-top:2px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);max-width:calc(100% - 32px);background:rgba(17,17,17,.94);color:#fff;padding:10px 16px;border-radius:var(--pill);font-size:14px;opacity:0;pointer-events:none;transition:all .2s;z-index:60;word-break:keep-all;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.row:focus-visible{outline-offset:-2px;border-radius:12px}
button:focus:not(:focus-visible){outline:none}
/* 요약 타일 — 누르면 해당 단계로 */
#home .sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 0}
.sum a{display:block;background:var(--neutral);border-radius:var(--radius-sm);padding:12px;text-decoration:none;color:var(--ink2);font-size:12.5px;min-height:44px}
.sum b{display:block;font-size:24px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.sum a.hot b{color:var(--bad)}
.card.small{padding:12px 16px}.card.small h2{font-size:15px}.card.small .sub{display:none}.card.small .empty{margin-top:2px}
/* 폰: 탭은 아래, 검색은 헤더 */
@media(max-width:899px){
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;margin:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:0 8px env(safe-area-inset-bottom);justify-content:space-around}
  .tabs button{border-bottom:0;min-height:52px}
  .tabs button.on{color:var(--ink);border-bottom:0}
  .topbar{padding-bottom:0;backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--bg)}
  .topbar-inner{flex-wrap:wrap;padding:10px 16px}
  .topsearch-wrap{width:100%}
  main{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
  .layout{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
  .toast{bottom:calc(72px + env(safe-area-inset-bottom))}
}
/* 랭킹은 한 화면에 더 많이 */
#rankList .nm{-webkit-line-clamp:1}
.rank-head{display:grid;gap:4px}
/* 상세: 아래 고정 버튼 */
.sheet-foot{flex:none;display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sheet-foot .btn{flex:1}
.link-q{font-size:14px;margin:0 0 8px}
.grp-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.grp-chips .chip{min-height:44px}
/* 담은 목록 */
.grp .sum-line{font-size:13px;color:var(--ink2);margin:0 0 4px}
.grp .memo{display:inline-block;background:var(--neutral);border-radius:var(--pill);padding:2px 10px;color:var(--ink2);font-size:12.5px;margin-top:4px}
.fb{margin:12px 0 4px;padding:8px 12px;border-radius:var(--radius-sm);background:var(--warn-soft);color:var(--warn);font-size:13px}
.pd-img{flex:none;display:block;border-radius:16px}
.pd-name{color:inherit;text-decoration:none}.pd-name span{color:var(--ink2);font-weight:400}

/* ── 2단계 묶음① ── */
.bdg{display:inline-block;margin-right:6px;padding:0 7px;border-radius:var(--pill);font-size:11.5px;font-weight:600;line-height:19px;vertical-align:1px}
.b-new{background:var(--neutral);color:var(--ink)}.b-peak{background:var(--warn-soft);color:var(--warn)}.b-up{background:var(--good-soft);color:var(--good)}.b-down{background:var(--bad-soft);color:var(--bad)}
.head-acts{display:flex;gap:8px;align-items:center}
.heart{min-height:44px;padding:0 14px;border:1px solid var(--line2);border-radius:var(--pill);background:#fff;font-size:14px;color:var(--ink)}
.heart.on{border-color:var(--bad);color:var(--bad);font-weight:600;background:var(--bad-soft)}
.lnk{border:0;background:transparent;padding:0;color:var(--ink2);font-size:13px;min-height:44px;display:inline-flex;align-items:center;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
#bs{z-index:41}#bsDim{z-index:40}#pd{z-index:43}#pdDim{z-index:42}
.brow{display:flex;align-items:center;gap:12px;width:100%;padding:12px 0;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;min-height:56px}
.list .brow:first-of-type{border-top:0}
.brow .rk{flex:none;width:28px;font-size:17px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums}
.brow .tx{flex:1;min-width:0}
.nm1{display:block;font-size:15px;font-weight:600;overflow-wrap:anywhere}
.meta{display:block;font-size:13px;color:var(--ink2);margin-top:2px}
.tag-new{color:var(--ink);font-weight:600}.tag-own{color:var(--good-ink);font-weight:600}
.hrt{color:var(--bad)}
.note{margin:12px 0 4px;font-size:13px;color:var(--ink2)}
.wrow{display:flex;align-items:center;gap:12px;width:100%;padding:10px 0;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;min-height:52px}
.card .wrow:first-of-type{border-top:0}
.wtx{flex:1;min-width:0}.wtx .br{display:block;font-size:12px;color:var(--ink2)}.wtx .nm1{font-size:14.5px;font-weight:400;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.wch{flex:none;max-width:48%;text-align:right;font-size:13px;font-weight:600;color:var(--ink2)}
.wch.up{color:var(--good)}.wch.down{color:var(--bad)}.wch.sale{color:var(--warn)}
@media(max-width:899px){.tabs button{font-size:13.5px}}

.bs-items .row .br{font-size:0}.bs-items .row .br .bdg{font-size:12px}
.hint{margin:0;padding:12px 16px;border-radius:var(--radius-sm);background:#fff;border:1px solid var(--line);color:var(--ink2);font-size:13px}
@media(min-width:900px){#brandList{max-width:760px}#pd.sheet.on{transform:translateY(-48%)}}
.chart svg{width:100%}

/* ── 트렌드 리포트 ── */
.rp-kicker{margin:0 0 4px;font-size:12.5px;color:var(--ink2);font-weight:600}
.rp-head{font-size:19px!important;line-height:1.35;margin:0 0 8px!important}
.rp-title{font-size:20px;font-weight:700;line-height:1.35;margin:4px 0 8px}
.rp-sum{margin:0 0 12px;padding-left:18px}.rp-sum li{margin:4px 0;font-size:14.5px}
.rp-open{width:100%}
.rp-item{padding:8px 0;border-top:1px solid var(--line)}.rp-item:first-of-type{border-top:0}
.rp-item b{font-weight:600}.rp-item p{margin:2px 0 0;font-size:14px;color:var(--ink2)}
.rp-why{display:block;margin-top:4px;font-size:13px;color:var(--ink);background:var(--neutral);border-radius:10px;padding:4px 8px}
.rp-note{margin-top:16px;font-size:12.5px;color:var(--ink2)}
.rp-date{min-height:44px;border:1px solid var(--line2);border-radius:var(--pill);padding:0 10px;background:#fff;font-size:14px}
.rp-head,.rp-title,.rp-sum li,.rp-item,.rp-why{overflow-wrap:anywhere}
/* ── 한눈에 보기 ── */
.vz-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;margin-top:4px}
@media(min-width:900px){.vz-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.vz-block{border-top:1px solid var(--line);padding-top:12px;min-width:0}
.vz-block h3{margin:0;font-size:15px;font-weight:700}
.vz-block .sub{margin:2px 0 8px}
.vz-donut{display:flex;gap:16px;align-items:center}
.vz-donut svg{flex:none;width:128px;height:128px}
.vz-legend{list-style:none;margin:0;padding:0;flex:1;min-width:0;font-size:13px}
.vz-legend li{display:grid;grid-template-columns:10px 1fr auto auto;gap:6px;align-items:center;padding:2px 0}
.vz-legend i{width:10px;height:10px;border-radius:3px}
.vz-legend span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vz-legend b{font-weight:600;font-variant-numeric:tabular-nums}.vz-legend em{font-style:normal;color:var(--ink2);font-size:12px;font-variant-numeric:tabular-nums}
.vz-bars{display:grid;gap:4px}
.vz-row{display:grid;grid-template-columns:minmax(64px,34%) 1fr auto;gap:8px;align-items:center;width:100%;min-height:32px;border:0;background:transparent;padding:0;text-align:left;font-size:13px;color:var(--ink)}
button.vz-row{min-height:44px}
.vz-lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vz-track{height:8px;background:var(--neutral);border-radius:var(--pill);overflow:hidden}
.vz-fill{display:block;height:100%;border-radius:var(--pill)}
.vz-val{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap}
.vz-key{display:flex;gap:12px;align-items:center;margin:6px 0 0;font-size:12px;color:var(--ink2)}
.vz-key i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.vz-cols{display:flex;gap:8px;align-items:flex-end;height:132px;padding-top:6px}
.vz-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;min-width:0}
.vz-cbar{width:70%;max-width:44px;background:#111;border-radius:6px 6px 0 0}
.vz-cv{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.vz-cl{font-size:11.5px;color:var(--ink2);white-space:nowrap}
.vz-multi{display:grid;gap:4px}
.vz-sm{display:grid;grid-template-columns:minmax(80px,38%) 1fr auto;gap:8px;align-items:center;font-size:13px}
.vz-smlab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.vz-smlab i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.vz-spark{width:100%;height:32px}
.vz-sm b{font-weight:600;font-variant-numeric:tabular-nums;font-size:12.5px}
.vz-mv{display:grid;grid-template-columns:minmax(0,40%) 1fr auto;gap:8px;align-items:center;width:100%;min-height:44px;border:0;border-top:1px solid var(--line);background:transparent;padding:4px 0;text-align:left;font-size:13px;color:var(--ink)}
.vz-mvname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.vz-mvname em{font-style:normal;color:var(--ink2)}
.vz-mvtrack{position:relative;height:8px;background:linear-gradient(to right,transparent calc(50% - 1px),var(--line2) calc(50% - 1px),var(--line2) calc(50% + 1px),transparent calc(50% + 1px))}
.vz-mvfill{position:absolute;top:0;height:100%;border-radius:var(--pill)}
.vz-mvval{font-size:12.5px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}.vz-mvval.up{color:var(--good)}.vz-mvval.down{color:var(--bad)}.vz-mvval small{font-weight:400;color:var(--ink2)}

/* ── 세트 ── */
#set.on{display:grid;gap:16px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mrow{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 0;border:0;border-top:1px solid var(--line);background:transparent;text-align:left}
.card .mrow:first-of-type{border-top:0}
.mrow .side{color:var(--muted);font-size:18px}
.mbadge{display:inline-block;margin-right:6px;padding:0 8px;border-radius:var(--pill);font-size:12px;font-weight:600;line-height:20px;white-space:nowrap}
.mbadge.own{background:var(--neutral);color:var(--ink)}.mbadge.col{background:var(--good-soft);color:var(--good)}.mbadge.col.soon{background:var(--warn-soft);color:var(--warn)}.mbadge.col.end{background:var(--neutral);color:var(--ink2)}.mbadge.oy{background:var(--bad-soft);color:var(--bad)}
.wide-btn{width:100%;margin-top:8px}
.btn[disabled]{opacity:.45}
.pending{margin-top:8px;padding:12px 14px;border-radius:var(--radius-sm);background:var(--pink);color:var(--ink);font-size:14px}
.setcard{margin-top:12px;padding:16px;border:1px solid var(--line2);border-radius:var(--radius-sm)}
.setcard h3{margin:0;font-size:16px;font-weight:700;overflow-wrap:anywhere}
.sitem{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.sitem .tx{flex:1;min-width:0}.sitem .nm1{font-weight:400;font-size:14.5px}.sitem a{color:var(--ink);text-decoration:none}
.role{font-size:12px;color:var(--ink2);font-weight:600;margin-right:4px}
.why{font-size:14px;margin:8px 0 4px;overflow-wrap:anywhere}
.setprice{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:8px 0;font-size:13.5px;color:var(--ink2)}.setprice b{color:var(--ink);font-weight:600}
.field>span{display:block;font-size:13px;color:var(--ink2);margin-bottom:4px}
.field select{width:100%;min-height:44px;border:1px solid var(--line2);border-radius:var(--radius-sm);padding:0 10px;font-size:16px;background:#fff}
#mtBody .seg{margin-bottom:12px}

/* ── 사이트 비교 ── */
.cmp{display:grid;gap:2px}
.cmp-row{display:grid;gap:3px;align-items:center;width:100%;min-height:44px;border:0;background:transparent;padding:2px 0;text-align:left;font-size:13px;color:var(--ink)}
.cmp-head{min-height:32px;font-size:11.5px;color:var(--ink2);position:sticky;top:calc(var(--top-h,66px) + 104px);background:#fff;z-index:2}
.cmp-head span{text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cmp-head span:first-child{text-align:left}
.cmp-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cmp-name i{font-style:normal;margin-right:4px}.cmp-name em{font-style:normal;font-size:11.5px}
.cmp-tag{display:inline-block;font-size:10.5px;font-weight:700;color:var(--ink2);background:var(--neutral);border-radius:6px;padding:1px 5px;vertical-align:1px}
.cmp-head em{font-style:normal;font-size:10.5px;color:var(--ink2)}
.cmp-cell{display:flex;align-items:center;justify-content:center;height:30px;border-radius:8px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.cmp-cell.empty{color:var(--muted);font-weight:400}
#brandView{margin-bottom:8px}

/* 대표색 점 */
.cdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-left:5px;vertical-align:1px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.cdot.clear{background:repeating-linear-gradient(45deg,#fff 0 2px,#d9d9de 2px 4px)!important}
.cchip .cdot{margin:0 6px 0 0}
.cnote{color:var(--ink)}

/* ── 사이드 필터/앵커 ── */
html{scroll-behavior:smooth}
#step1,#step2,#step3,#step4,#step5{scroll-margin-top:16px}
.side-anchors{display:none}
.chip-anchors{display:none}
@media(max-width:899px){
  #step1,#step2,#step3,#step4,#step5{scroll-margin-top:calc(var(--top-h,66px) + 100px)}
  .chip-anchors.show{display:flex;position:sticky;top:var(--top-h,66px);z-index:15;gap:8px;overflow-x:auto;white-space:nowrap;background:var(--bg);padding:8px 16px;margin:0;scrollbar-width:none}
  .chip-anchors::-webkit-scrollbar{display:none}
  .chip-anchors a{flex:none;min-height:44px;display:inline-flex;align-items:center;padding:0 16px;border-radius:var(--pill);border:1px solid var(--line2);background:#fff;color:var(--ink);font-size:14px;text-decoration:none}
}
@media(min-width:900px){
  .side-anchors.show{display:block;margin-top:8px;border-top:1px solid var(--line);padding-top:14px}
  .side-anchors-title{margin:0 0 6px;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
  .side-anchors a{display:block;min-height:36px;line-height:36px;padding:0 4px;color:var(--ink2);text-decoration:none;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .side-anchors a:hover{color:var(--ink)}
}

/* 브랜드 검색 */
.bc-form{display:flex;gap:8px;margin:4px 0 8px}
.bc-form input{flex:1;min-width:0;height:44px;border:1px solid var(--line);border-radius:var(--radius-sm);padding:0 14px;font-size:16px;background:var(--card)}
.bc-form .btn{min-height:44px}
.bc-recent{margin-top:8px}
.bc-head{margin:8px 0 12px}
.bc-head h2{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:2px 0 12px}
.bc-stat{display:flex;gap:20px;margin-bottom:12px}
.bc-stat span{display:flex;flex-direction:column;font-size:12.5px;color:var(--ink2)}
.bc-stat b{font-size:22px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.bc-ratio{height:8px;border-radius:var(--pill);background:var(--line);overflow:hidden;margin-bottom:6px}
.bc-ratio span{display:block;height:100%;background:var(--ink);border-radius:var(--pill)}
.bc-ours{margin-top:10px;font-size:13.5px}
.bc-ours summary{cursor:pointer;min-height:44px;display:flex;align-items:center;color:var(--ink)}
.bc-ours ul{margin:0;padding-left:18px;color:var(--ink2)}
.bc-filter{margin-bottom:8px}
.bc-row{text-decoration:none;color:inherit}
.bc-row .meta{line-height:1.45}
.bc-no{font-size:12px;font-weight:600;color:var(--warn);background:var(--warn-soft);border-radius:var(--pill);padding:3px 8px;white-space:nowrap}
.tag-old{font-style:normal;font-size:11px;color:var(--ink2);border:1px solid var(--line);border-radius:8px;padding:1px 5px}
/* 유튜브 쇼츠 */
#c-yt{margin-top:0}
.yt-sub{margin-top:14px}
.yt-list{display:flex;flex-direction:column}
.yt-row{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 0;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.yt-v{flex:none;width:52px;font-weight:700;font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums}
.yt-row .tx{flex:1;min-width:0}
.yt-row .nm1{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
[hidden]{display:none!important}
.list.plain{background:none;padding:0;border-radius:0;border:0;box-shadow:none}
.bc-filter{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.bc-filter::-webkit-scrollbar{display:none}
.bc-filter .chip{flex:none}

/* ── 성장 pill ── */
.pill{display:inline-flex;align-items:center;min-height:22px;padding:2px 10px;border-radius:var(--pill);font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill-up{background:var(--good-soft);color:var(--good)}
.pill-down{background:var(--bad-soft);color:var(--bad)}
.pill-new{background:#111;color:#fff}

/* ── HERO: 급상승 키워드 ── */
.hero-card{padding:24px}
.hero-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:16px}
.hero-head h2{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:0}
.live-pill{display:inline-flex;align-items:center;gap:6px;background:#111;color:#fff;border-radius:var(--pill);padding:3px 10px 3px 8px;font-size:11px;font-weight:700;letter-spacing:.04em}
.live-dot{width:6px;height:6px;border-radius:50%;background:#22c55e}
.hero-range{margin-left:auto;font-size:12.5px;color:var(--ink2)}
.hero-tiles{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media(min-width:700px){.hero-tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.hero-tile{background:var(--bg);border-radius:var(--radius);padding:18px}
.hero-tile-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hero-kw{font-size:24px;font-weight:700;letter-spacing:-.02em;overflow-wrap:anywhere}
.hero-sub{margin:6px 0 10px;font-size:12.5px;color:var(--ink2)}
.hero-spark{width:100%;height:44px;display:block}

/* ── TOP5 / 팔레트 ── */
.top-row{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
@media(min-width:1100px){.top-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.top5-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.top5-row:first-of-type{border-top:0}
.top5-rk{flex:none;width:22px;font-size:12.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.top5-mono{flex:none;width:32px;height:32px;border-radius:50%;background:var(--neutral);color:var(--ink);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.top5-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.top5-name{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top5-track{height:6px;border-radius:var(--pill);background:var(--neutral);overflow:hidden}
.top5-fill{display:block;height:100%;border-radius:var(--pill);background:#111}
.palette-swatches{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0 16px}
.palette-swatch{display:flex;flex-direction:column;align-items:center;gap:4px;width:54px}
.swatch-circle{width:44px;height:44px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.swatch-name{font-size:11.5px;color:var(--ink2);text-align:center}
.swatch-pct{font-size:12px;font-weight:700}
.palette-list{display:grid;gap:2px}
.palette-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:13px}
.palette-row:first-of-type{border-top:0}
.palette-dot{flex:none;width:10px;height:10px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.palette-name{flex:1;min-width:0}
.palette-pct{color:var(--ink2);font-variant-numeric:tabular-nums}
.date-chip{font-size:11.5px;font-weight:600;color:var(--ink2);background:var(--neutral);border-radius:var(--pill);padding:3px 10px}
/* 모바일: 급상승 키워드 타일은 옆으로 넘기기 */
@media(max-width:699px){
  .hero-tiles{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;margin:0 -24px;padding:0 24px 4px;scrollbar-width:none}
  .hero-tiles::-webkit-scrollbar{display:none}
  .hero-tile{flex:0 0 78%;scroll-snap-align:start}
  .hero-range{margin-left:0;width:100%}
}
.date-chip{min-height:0;height:auto;padding:4px 10px;font-size:12px;align-self:flex-start;pointer-events:none}
@media(max-width:899px){nav.tabs,.tabs{background:#fff!important;box-shadow:0 -1px 0 var(--line)}}
body.not-home .filter-col,body.not-home .filter-mobile{display:none!important}
@media(min-width:1100px){body.not-home .layout{grid-template-columns:minmax(0,1fr)}}

/* ── 0925 QA: 스크롤바·필터·토글·스켈레톤 ── */
*{scrollbar-width:thin;scrollbar-color:#e5e7eb transparent}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:#e5e7eb;border-radius:999px}
::-webkit-scrollbar-track{background:transparent}
.hide-scrollbar,.chips,.filter-mobile,.chip-anchors{-ms-overflow-style:none;scrollbar-width:none}
.chips::-webkit-scrollbar,.filter-mobile::-webkit-scrollbar,.chip-anchors::-webkit-scrollbar{display:none}
/* 왼쪽 카테고리 */
.filter-cat{border-radius:12px;padding:0 10px;transition:background .15s}
.filter-cat:hover{background:#f3f4f6}
.filter-cat b{background:#f3f4f6;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;color:#6b7280}
.filter-cat.on{background:#111;color:#fff}
.filter-cat.on b{background:rgba(255,255,255,.15);color:#fff}
/* 위쪽 필터 칩 줄: 양끝 흐려짐 + 끌어서 넘기기 */
.chips,.filter-mobile{overflow-x:auto;flex-wrap:nowrap!important;cursor:grab;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 24px),transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 24px),transparent 100%);padding-left:8px}
.chips.grabbing,.filter-mobile.grabbing{cursor:grabbing;user-select:none}
.chips .chip,.filter-mobile .chip{border:1px solid #e5e7eb;transition:background .2s,color .2s}
.chips .chip.on{background:#111;color:#fff;border-color:#111}
/* 일간/주간 같은 분절 토글 */
.seg{background:#f3f4f6;border-radius:14px;padding:4px;gap:4px}
.seg button{border-radius:10px;transition:background .2s,color .2s,box-shadow .2s}
.seg button.on{background:#111;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.18)}
/* 손가락 화면에선 누르기 쉽게 44px 유지 */
/* PC(마우스)에선 40px, 폰·폴드(900px 미만 또는 손가락)는 44px 유지 */
@media (min-width:900px) and (pointer:fine){.filter-cat,.chips .chip,.filter-mobile .chip,.seg button{min-height:40px;height:40px}}
/* 스켈레톤 */
.skel{display:flex;flex-direction:column;gap:14px;padding:16px;background:#fff;border:1px solid #ececec;border-radius:20px}
.skel-row{display:flex;gap:14px;align-items:center}
.skel-img{flex:none;width:80px;height:80px;border-radius:14px}
.skel-tx{flex:1;display:flex;flex-direction:column;gap:9px}
.skel-bar{display:block;height:12px;border-radius:999px}
.skel-bar.w60{width:60%}.skel-bar.w90{width:90%}.skel-bar.w40{width:40%}
.skel-lines{display:flex;flex-direction:column;gap:10px;padding:6px 10px}
.skel-lines .skel-bar{height:14px}
.skel-img,.skel-bar{background:linear-gradient(90deg,#f3f4f6 25%,#e9eaee 37%,#f3f4f6 63%);background-size:400% 100%;animation:skel 1.3s ease infinite}
@keyframes skel{0%{background-position:100% 50%}100%{background-position:0 50%}}
@media (prefers-reduced-motion:reduce){.skel-img,.skel-bar{animation:none}}

/* ── PC 옆 칸 상세 (1100px+, 랭킹·브랜드) ── */
.split-side{display:none}
@media(min-width:1100px){
  .split{display:grid;grid-template-columns:minmax(0,1fr) minmax(380px,1.05fr);gap:20px;align-items:start}
  .split-side.on{display:block;position:sticky;top:88px}
  .sheet.docked,#pd.sheet.docked,#bs.sheet.docked{top:auto!important;opacity:1!important;pointer-events:auto!important;transform:none!important}
  .split #brandList{max-width:none}
  .sheet.docked{position:relative;inset:auto;left:auto;right:auto;bottom:auto;transform:none;visibility:visible;max-width:none;margin:0;max-height:calc(100vh - 108px);border-radius:20px;border:1px solid #ececec;box-shadow:0 4px 24px rgba(0,0,0,.04);z-index:auto!important;transition:none}
  .sheet.docked .close{display:none}
  .sheet.docked .sheet-body{overflow-y:auto}
  .brow.sel,.row.sel{background:#f3f4f6;box-shadow:inset 3px 0 0 #111}
}

/* 헤더: 레디영 MD 송주희 주임 전용 (그라데이션 테두리 알약) */
.owner-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px 4px 9px;font-size:11.5px;font-weight:600;color:#111;border:1px solid transparent;border-radius:999px;
  background:linear-gradient(#fff,#fff) padding-box,linear-gradient(120deg,#f6d5d8,#d6ddd3 55%,#e5e7eb) border-box;box-shadow:0 1px 2px rgba(0,0,0,.04);white-space:nowrap;letter-spacing:-.01em}
.owner-pill .op-ic{width:13px;height:13px;color:#c08a91}
.owner-pill .op-org{color:#6b7280;font-weight:500}
.owner-pill .op-dot{width:3px;height:3px;border-radius:50%;background:#c9c9cf}
.owner-pill .op-name{font-weight:700;background:linear-gradient(90deg,#111,#5b5b63);-webkit-background-clip:text;background-clip:text;color:transparent}
@media(max-width:520px){.owner-pill .op-org,.owner-pill .op-dot{display:none}}

/* 오늘 확인: 도넛 + 숫자 타일 (빈 여백 채우기) */
.step1-bottom{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;margin-top:16px;align-items:center}
.step1-bottom .mini-viz{margin-top:0}
@media(min-width:900px){.step1-bottom{grid-template-columns:280px minmax(0,1fr)}}
.s1-kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:700px){.s1-kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
.s1k{background:#fafaf8;border:1px solid #ececec;border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.s1k b{font-size:19px;font-weight:700;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}
.s1k-l{font-size:12px;font-weight:600;color:#8a8a8a}
.s1k-s{font-size:12px;color:#6b7280;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s1k.warn b{color:#b42318}

/* 구글 검색량 */
#gt-kw{margin-top:20px}
.gt-list{display:grid;grid-template-columns:minmax(0,1fr);gap:0 28px}
@media(min-width:1100px){.gt-list{grid-template-columns:repeat(2,minmax(0,1fr))}}
.gt-row{display:grid;grid-template-columns:minmax(0,1fr) 110px 64px 72px;align-items:center;gap:12px;min-height:52px;border-top:1px solid #ececec}
.gt-t{display:flex;align-items:baseline;gap:8px;min-width:0}
.gt-t b{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gt-t em{font-style:normal;font-size:11.5px;color:#8a8a8a;flex:none}
.gt-row .hero-spark{width:110px;height:34px}
.gt-v{font-size:12.5px;color:#6b7280;font-variant-numeric:tabular-nums;text-align:right}
.gt-row .pill{justify-self:end}
@media(max-width:420px){.gt-row{grid-template-columns:minmax(0,1fr) 80px 64px}.gt-v{display:none}.gt-row .hero-spark{width:80px}}
/* ── 화면 크기 자동 맞춤: 작은 폰(320~360)부터 큰 폰(430)까지 글자·여백이 폭에 따라 조절 ── */
.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis div{min-width:0}
.kpis b{font-size:clamp(15px,4.6vw,20px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpis span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:899px){
  main{padding-left:clamp(12px,4vw,20px);padding-right:clamp(12px,4vw,20px)}
  .card{padding:clamp(16px,5vw,24px)}
  .hero-head h2,.step-head h2{font-size:clamp(18px,5.4vw,22px)}
  .hero-kw{font-size:clamp(20px,6.4vw,26px)}
  .s1k b{font-size:clamp(16px,4.8vw,19px)}
}
@media(max-width:360px){.kpis div{padding:10px 8px}.s1-kpis{gap:8px}.s1k{padding:10px 12px}}
.hero-tile-top{flex-wrap:wrap;row-gap:6px}
.hero-kw{word-break:keep-all;overflow-wrap:normal}

/* 0926 물류앱 연결 정보 */
.link-row .li-info{display:block;margin-top:3px;font-size:12px;color:#6e6e73;line-height:1.45}

<script>var S = { tab: 'home', home: null, rank: { cat: 'all', mode: 'day', data: null }, board: null, pdKey: '', layers: [], brand: { cat: 'all', data: null, cur: '' }, rev: { home: 0, rank: 0, pd: 0, board: 0, brands: 0, bs: 0 } };

function catCodeByLabel(label) { for (var i = 0; i < CATS.length; i++) { if (CATS[i][1] === label) return CATS[i][0]; } return null; }

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

/* 불러오는 동안: 사진 + 글줄 3개 모양의 뼈대(스켈레톤) */
function skel(n) { var one = '<div class="skel-row" aria-hidden="true"><i class="skel-img"></i><span class="skel-tx"><i class="skel-bar w60"></i><i class="skel-bar w90"></i><i class="skel-bar w40"></i></span></div>'; var h = ''; for (var i = 0; i < (n || 3); i++) h += one; return '<div class="skel" role="status" aria-label="불러오는 중">' + h + '</div>'; }
/* 가로 칩 줄: 마우스로 끌어서 넘기기 */
function dragScroll(el) {
  if (!el || el.__drag) return; el.__drag = 1; var down = false, x0 = 0, s0 = 0, moved = false;
  el.addEventListener('mousedown', function (e) { down = true; moved = false; x0 = e.pageX; s0 = el.scrollLeft; el.classList.add('grabbing'); });

}
function go(tab) {

  var bands = [[0, 10000, '~1만'], [10000, 20000, '1~2만'], [20000, 30000, '2~3만'], [30000, Infinity, '3만+']];

    + '<div class="field"><span>대표색 (최대 2개 · 세트 색 조합에 써요)</span><div class="grp-chips">' + (meta.colors || []).filter(function (c) { return COLOR_HEX[c]; }).map(function (c) { var on = (m.colors || []).indexOf(c) !== -1; return '<button type="button" class="chip cchip' + (on ? ' on' : '') + '" aria-pressed="' + on + '" data-c="' + esc(c) + '" onclick="toggleColor(this.dataset.c)">' + cdots([c]) + esc(c) + '</button>'; }).join('') + '</div></div>'
    + '<label class="field"><span>특징 한 줄</span><input id="mtFeat" maxlength="120" value="' + esc(m.feature || '') + '" placeholder="예: 약국 전용 진정 크림, 민감 피부용"></label>'
    + '<label class="field"><span>판매가 (원)</span><input id="mtPrice" inputmode="numeric" value="' + esc(m.price || '') + '"></label>'
    + (col ? '<label class="field"><span>협업 시작일</span><input id="mtStart" type="date" value="' + esc((m.start || '').replace(/\./g, '-')) + '"></label><label class="field"><span>협업 종료일 *</span><input id="mtEnd" type="date" value="' + esc((m.end || '').replace(/\./g, '-')) + '"></label><label class="field"><span>협업 조건</span><input id="mtCond" maxlength="120" value="' + esc(m.cond || '') + '" placeholder="예: 세트 대표 상품으로, 최소 2종 포함"></label>' : '')
    + '<p class="np-err" id="mtErr"></p>';
  $('mtFoot').innerHTML = '<button type="button" class="btn pri" data-act="save-mat" onclick="saveMat()">저장</button>' + (m.id ? '<button type="button" class="btn danger" onclick="delMat()">삭제</button>' : '');
}
function toggleUse(u) { var m = S.set.edit; syncMat(); var i = m.uses.indexOf(u); if (i !== -1) m.uses.splice(i, 1); else if (m.uses.length < 3) m.uses.push(u); else { toast('용도는 3개까지예요'); return; } renderMat(); }
function syncMat() {
  var m = S.set.edit, v = function (id) { var e = $(id); return e ? e.value.trim() : ''; };
  m.name = v('mtName'); m.brand = v('mtBrand'); m.category = v('mtCat'); m.feature = v('mtFeat'); m.price = v('mtPrice').replace(/[^\d]/g, '');
  if (m.kind === '협업') { m.start = v('mtStart').replace(/-/g, '.'); m.end = v('mtEnd').replace(/-/g, '.'); m.cond = v('mtCond'); }
}
function saveMat() {
  if (S.saving) return; syncMat(); var m = S.set.edit;
  if (!m.name) { $('mtErr').textContent = '제품 이름을 입력해 주세요'; return; }
  if (m.kind === '협업' && !m.end) { $('mtErr').textContent = '협업 종료일을 골라 주세요'; return; }
  S.saving = true;
  call('saveMaterial', [m], function (r) { S.saving = false; if (!r || !r.ok) { $('mtErr').textContent = (r && r.msg) || '저장하지 못했어요'; return; } toast('저장했어요'); closeMt(); loadSetTab(); }, function () { S.saving = false; $('mtErr').textContent = '저장하지 못했어요'; });
}
function delMat() {
  var m = S.set.edit; if (!m.id || !confirm('[' + m.name + '] 재료를 지울까요?')) return;
  call('removeMaterial', [m.id], function () { toast('지웠어요'); closeMt(); loadSetTab(); });
}
function closeMt() { layerClose('mt'); }
function hideMt() { $('mtDim').classList.remove('on'); $('mt').classList.remove('on'); $('mt').setAttribute('aria-hidden', 'true'); if (S.mtFrom && S.mtFrom.focus && document.body.contains(S.mtFrom)) S.mtFrom.focus(); }

/* ── 사이트 비교 (브랜드 교차표) ── */
var CMP_TYPE = { everywhere: ['전역', '어디서나'], abroad: ['해외', '해외에서'], home: ['국내', '국내에서'], mixed: ['', ''] };
function cmpShade(rank) {   /* 순위가 높을수록 진한 검정 (한 가지 색의 명도 단계) */
  var steps = ['#111111', '#333333', '#555555', '#777777', '#9a9a9a', '#c9c9c9'];
  var i = rank <= 3 ? 0 : rank <= 10 ? 1 : rank <= 20 ? 2 : rank <= 40 ? 3 : rank <= 70 ? 4 : 5;
  return { bg: steps[i], fg: i <= 3 ? '#fff' : '#111111' };
}
function loadCompare() {
  $('brandList').innerHTML = skel(3);
  call('getCompare', [], function (c) {
    if (!c || !c.ok) { $('brandList').innerHTML = '<div class="msg">불러오지 못했어요</div>'; return; }
    S.cmp = c; renderCompare();
  });
}
function renderCompare() {
  var c = S.cmp, el = $('brandList');
  if (!c.malls.length || c.malls.length < 2) { el.innerHTML = '<div class="msg">다른 사이트 수집이 쌓이면 비교표가 나와요 (올리브영 글로벌·화해·다이소·무신사·큐텐·아마존)</div>'; return; }
  var head = '<div class="cmp-row cmp-head" style="grid-template-columns:minmax(96px,1.4fr) repeat(' + c.malls.length + ',minmax(34px,1fr))"><span>브랜드</span>' + c.malls.map(function (m) { return '<span title="' + esc(m.label + ' · ' + m.date) + '">' + esc(m.label.replace('올리브영 ', '').replace('올리브영', '올영')) + (m.abroad ? ' <em>해외</em>' : '') + '</span>'; }).join('') + '</div>';
  var rows = c.brands.map(function (b) {
    var t = CMP_TYPE[b.type] || ['', ''];
    return '<button type="button" class="cmp-row" data-b="' + esc(b.brand) + '" onclick="openBrand(this.dataset.b)" style="grid-template-columns:minmax(96px,1.4fr) repeat(' + c.malls.length + ',minmax(34px,1fr))"><span class="cmp-name">' + (t[0] ? '<i class="cmp-tag" title="' + t[1] + ' 뜨는 브랜드">' + t[0] + '</i>' : '') + esc(b.brand) + (b.owned === true ? ' <em class="tag-own">약국</em>' : '') + '</span>'
      + c.malls.map(function (m) { var r = b.ranks[m.mall]; if (!r) return '<span class="cmp-cell empty">·</span>'; var s = cmpShade(r); return '<span class="cmp-cell" style="background:' + s.bg + ';color:' + s.fg + '" title="' + esc(m.label + ' ' + r + '위 · ' + (b.counts[m.mall] || 1) + '개') + '">' + r + '</span>'; }).join('') + '</button>';
  }).join('');
  el.innerHTML = '<p class="note">칸 숫자 = 그 사이트에서 이 브랜드의 가장 높은 순위 (진할수록 상위) · 전역 3곳 이상 · 해외 해외에서만 · 국내 국내에서만</p><div class="cmp">' + head + rows + '</div>';
}
function setBrandView(v) { S.brand.view = v; if (v !== 'oy') undockSheet('bs'); [].forEach.call(document.querySelectorAll('#brandView button'), function (b) { var on = b.dataset.v === v; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); }); $('brandChips').hidden = v !== 'oy'; clearTimeout(S.bcTimer); $('brandList').classList.toggle('plain', v === 'find'); if (v === 'cmp') loadCompare(); else if (v === 'find') loadFind(); else loadBrands(); }
/* ── 브랜드 검색 (화해 전체 상품 + 우리 약국 보유) ── */
function safeUrl(u) { return /^https:\/\//.test(String(u || '')) ? u : ''; }
function loadFind() {
  S.bc = S.bc || { f: 'all', old: false };
  if (S.bc.res || S.bc.pending) { renderFind(); return; }
  $('brandList').innerHTML = skel(3);
  call('getBrandSearches', [], function (r) { S.bc.recent = r && r.ok ? r.items : []; if (S.brand.view === 'find') renderFind(); });
}
function findForm() {
  var q = S.bc.q || '';
  return '<form class="bc-form" onsubmit="event.preventDefault();bcSearch($(\'bcQ\').value)"><input id="bcQ" type="search" enterkeyhint="search" maxlength="30" placeholder="브랜드 이름 (예: 코나피딜)" aria-label="브랜드 이름" value="' + esc(q) + '"><button type="submit" class="btn pri">검색</button></form>'
    + '<p class="note">손님이 묻는 브랜드의 전체 상품을 화해에서 가져와, 우리 약국에 있는지 같이 보여줘요 · 한 번 찾은 브랜드는 7일 보관</p>';
}
function renderFind() {
  var b = S.bc, h = findForm();
  if (b.pending) h += '<div class="pending">맥이 화해에서 <b>' + esc(b.q) + '</b> 상품을 가져오는 중이에요 (보통 1~2분)' + (b.polls >= 40 ? '<br><b>10분이 지나도 결과가 없어요. 맥이 켜져 있는지 확인하고 다시 검색해 주세요</b>' : b.polls > 16 ? '<br><b>오래 걸리고 있어요 — 맥이 꺼져 있거나 잠자기 상태일 수 있어요</b>' : '') + '</div>';
  else if (b.res) h += findResult(b.res);
  else if (b.recent && b.recent.length) h += '<div class="bc-recent"><p class="sub">최근 찾은 브랜드</p><div class="grp-chips">' + b.recent.map(function (x) { return '<button type="button" class="chip" data-q="' + esc(x.q) + '" onclick="bcSearch(this.dataset.q)">' + esc(x.q) + (x.count ? ' · ' + x.count : '') + '</button>'; }).join('') + '</div></div>';
  $('brandList').innerHTML = h;
}
function findResult(r) {
  if (r.status === 'failed') return '<p class="empty">' + esc(r.msg || '가져오지 못했어요') + '</p><button type="button" class="btn pri wide-btn" data-q="' + esc(r.q) + '" onclick="bcSearch(this.dataset.q, true)">다시 가져오기</button>';
  if (r.status === 'empty') return '<p class="empty">' + esc(r.msg || '찾은 상품이 없어요') + ' · 다른 표기(영문 등)로도 찾아보세요</p>';
  var f = S.bc.f, live = r.items.filter(function (x) { return !x.obsolete; }), pool = S.bc.old ? r.items : live;
  var own = live.filter(function (x) { return x.owned; }).length, pct = live.length ? Math.round(own / live.length * 100) : 0;
  var list = pool.filter(function (x) { return f === 'all' || (f === 'none' ? !x.owned : x.owned); });
  var chip = function (k, lab) { return '<button type="button" class="chip' + (f === k ? ' on' : '') + '" aria-pressed="' + (f === k) + '" data-f="' + k + '" onclick="S.bc.f=this.dataset.f;renderFind()">' + lab + '</button>'; };
  return '<article class="card bc-head"><p class="step-eye">' + esc(r.date.slice(0, 10)) + ' · 화해 기준</p><h2>' + esc(r.brand) + '</h2>'
    + '<div class="bc-stat"><span><b>' + live.length + '</b>판매 중</span><span><b>' + (r.logiOk ? own + '/' + live.length : '–') + '</b>우리 약국 보유</span><span><b>' + (r.items.length - live.length) + '</b>단종</span></div>'
    + (r.logiOk ? '<div class="bc-ratio" role="img" aria-label="보유 ' + pct + '%"><span style="width:' + pct + '%"></span></div><p class="sub">보유 ' + pct + '% · 나머지는 손님 문의 시 주문 검토 대상</p>' : '<p class="sub">물류앱을 읽지 못해 보유 여부는 알 수 없어요</p>')
    + (r.ours && r.ours.length ? '<details class="bc-ours"><summary>물류앱에 있는 ' + esc(r.brand.replace(/\s*\(.*\)/, '')) + ' 상품 ' + r.ours.length + '개</summary><ul>' + r.ours.map(function (n) { return '<li>' + esc(n) + '</li>'; }).join('') + '</ul></details>' : '')
    + '</article><div class="grp-chips bc-filter">' + chip('all', '전체') + chip('none', '우리 없음') + chip('own', '우리 있음')
    + '<button type="button" class="chip' + (S.bc.old ? ' on' : '') + '" aria-pressed="' + S.bc.old + '" data-f="old" onclick="S.bc.old=!S.bc.old;renderFind()">단종 포함</button></div>'
    + (list.length ? '<div class="list">' + list.map(bcRow).join('') + '</div>' : '<p class="empty">해당하는 상품이 없어요</p>');
}
function bcRow(x) {
  var u = safeUrl(x.url), img = safeUrl(x.img);
  var tag = x.owned === true ? '<span class="own-yes">✓ 약국 있음</span>' : x.owned === false ? '<span class="bc-no">우리 없음</span>' : '';
  var inner = (img ? '<img class="thumb" src="' + esc(img) + '" alt="" loading="lazy">' : '<span class="thumb"></span>')
    + '<span class="tx"><span class="nm1">' + esc(x.name) + (x.obsolete ? ' <em class="tag-old">단종</em>' : '') + '</span><span class="meta">' + esc([x.capacity, x.price ? won(x.price) : '', x.rating ? '★' + x.rating + ' (' + x.reviews + ')' : ''].filter(Boolean).join(' · ')) + (x.match ? '<br>물류앱: ' + esc(x.match) : '') + '</span></span><span class="side">' + tag + '</span>';
  return u ? '<a class="row bc-row" href="' + esc(u) + '" target="_blank" rel="noopener">' + inner + '</a>' : '<div class="row bc-row">' + inner + '</div>';
}
function bcSearch(q, retry) {
  q = String(q || '').trim(); if (q.length < 2) { toast('브랜드 이름을 2글자 이상 넣어 주세요'); return; }
  S.bc.q = q; S.bc.res = null; S.bc.pending = false; S.bc.polls = 0; S.bc.f = 'all'; S.bc.old = false; clearTimeout(S.bcTimer);
  $('brandList').innerHTML = findForm() + '<div class="msg">찾는 중…</div>';
  bcPoll(retry);
}
function bcPoll(retry) {
  var q = S.bc.q;
  call('searchBrand', [q, !!retry], function (r) {
    if (S.brand.view !== 'find' || q !== S.bc.q) return;   // 그사이 다른 화면·다른 검색으로 바뀌었으면 버린다
    if (!r || !r.ok) { toast((r && r.msg) || '검색하지 못했어요'); S.bc.pending = false; renderFind(); return; }
    if (r.status === 'pending') { S.bc.pending = true; S.bc.polls = (S.bc.polls || 0) + 1; renderFind(); clearTimeout(S.bcTimer); if (S.bc.polls < 40 && S.brand.view === 'find') S.bcTimer = setTimeout(bcPoll, 15000); return; }
    if (r.status === 'failed') { S.bc.pending = false; S.bc.res = r; renderFind(); return; }
    S.bc.pending = false; S.bc.res = r; renderFind();
  });
}
/* ── 유튜브 쇼츠 (홈 ②) ── */
function viewsKo(n) { return n >= 10000 ? Math.round(n / 10000) + '만' : n >= 1000 ? (n / 1000).toFixed(1).replace(/\.0$/, '') + '천' : String(n); }
function loadYt() {
  if (S.yt) { renderYt(); return; }
  call('getYoutube', [], function (y) { S.yt = y && y.ok ? y : { total: 0 }; renderYt(); });
}
function renderYt() {
  var el = $('c-yt'), y = S.yt; step1Kpis(); if (!el) return;
  if (!y.total) { el.innerHTML = '<h2>유튜브 쇼츠</h2><p class="empty">최근 7일 인기 뷰티 쇼츠가 모이면 여기에 떠요</p>'; return; }
  el.innerHTML = '<h2>유튜브 쇼츠에서 뜨는 브랜드</h2><p class="sub">최근 7일 인기 뷰티 쇼츠 ' + y.total + '개 · 제목·태그에 나온 브랜드의 조회수 합</p>'
    + (y.brands.length ? vzBars(y.brands.slice(0, 6).map(function (b) { return { label: b.brand, value: b.views, text: viewsKo(b.views) + '회 · ' + b.videos + '편', brand: b.brand }; })) : '<p class="empty">아직 브랜드가 언급된 영상이 없어요</p>')
    + (y.items && y.items.length ? '<p class="sub yt-sub">뜨는 아이템 (영상 제목·태그 기준 조회수 합)</p>' + vzBars(y.items.slice(0, 6).map(function (x) { return { label: x.label, value: x.views, text: viewsKo(x.views) + '회 · ' + x.videos + '편' }; })) : '')
    + '<p class="sub yt-sub">조회수 TOP 영상</p><div class="yt-list">' + y.videos.slice(0, 5).map(function (v) { return '<a class="yt-row" href="https://www.youtube.com/shorts/' + encodeURIComponent(v.id) + '" target="_blank" rel="noopener"><span class="yt-v">' + viewsKo(v.views) + '</span><span class="tx"><span class="nm1">' + esc(v.title) + '</span><span class="meta">' + esc(v.channel) + ' · ' + v.seconds + '초</span></span><span class="side">↗</span></a>'; }).join('') + '</div>';
}
function otherMallsHtml(list) {
  if (!list || !list.length) return '';
  return '<div class="pd-sec"><h4>다른 사이트 순위</h4>' + list.map(function (x) { return '<div class="link-row"><span><b>' + esc(x.label) + '</b> ' + x.rank + '위 <small class="meta">' + esc(x.name) + '</small></span>' + (x.url && /^https:\/\//.test(x.url) ? '<a class="btn" href="' + esc(x.url) + '" target="_blank" rel="noopener">보기 ↗</a>' : '') + '</div>'; }).join('') + '</div>';
}
</script>
