:root{color-scheme:light dark;
  --bg:#F5F6F8;--card:#fff;--fill:#F2F3F5;--fill-2:#E8EAEE;--line:#EDEEF0;--line-strong:#DEE1E6;--glass:rgba(245,246,248,.86);--tabbar:rgba(255,255,255,.94);

  --amber:#FFFBEB;--amber-line:#FDE68A;--amber-ink:#8a4b08;

  --r-mark:999px;--r-tag:12px;--r-sm:12px;--r-tile:12px;--r-card:20px;--pill:999px;

  --toast:rgba(17,24,39,.94);--toast-ink:#fff;

}

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:var(--fs-3);line-height:1.5;-webkit-font-smoothing:antialiased;word-break:keep-all;text-rendering:optimizeLegibility}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--pri-text)}
button:active:not([disabled]){transform:scale(.98)}
[hidden]{display:none!important}
img,svg,video,canvas{max-width:100%}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px;box-shadow:0 0 0 5px var(--ring)}
button:focus:not(:focus-visible){outline:none}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--pri);outline-offset:0;box-shadow:0 0 0 5px var(--ring)}
*{scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:var(--pill)}
::-webkit-scrollbar-track{background:transparent}
.ic{flex:none;width:20px;height:20px;vertical-align:middle}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
kbd{display:inline-flex;align-items:center;height:22px;padding:0 6px;border:1px solid var(--line-strong);border-radius:6px;background:var(--card);font:600 var(--fs-1)/1 inherit;color:var(--ink2)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* ── 앱 셸: 폰·폴드 = 위 헤더 + 아래 탭 6개 / PC(1100+) = 왼쪽 사이드바 + 위 검색 ── */
.app{min-height:100vh}
.col{min-width:0}
.topbar{position:sticky;top:0;z-index:20;height:var(--top-h);background:var(--glass);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.topbar-inner{display:flex;align-items:center;gap:12px;height:100%;padding:0 var(--gutter);min-width:0}
.logo{display:flex;align-items:center;gap:8px;flex:none}
.logo-mark{width:28px;height:28px;border-radius:9px;background:linear-gradient(140deg,#155EEF 0%,#4F7BFF 55%,#8B5CF6 100%);box-shadow:0 2px 6px rgba(21,94,239,.28),inset 0 1px 0 rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;padding:2px;flex:none}
.logo-text{font-size:var(--fs-4);font-weight:800;letter-spacing:-.01em}
.logo-text b{font-weight:800;background:linear-gradient(90deg,#155EEF,#8B5CF6);-webkit-background-clip:text;background-clip:text;color:transparent}
.status-dot,.side-status{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border:0;border-radius:var(--pill);background:transparent;color:var(--ink2);font-size:var(--fs-2);font-weight:600;white-space:nowrap;transition:background var(--t)}
.status-dot i,.side-status i,.st-line i{width:8px;height:8px;border-radius:50%;background:var(--flat);box-shadow:0 0 0 3px color-mix(in srgb,var(--flat) 22%,transparent)}
[data-tone="ok"] i{background:#16a34a;box-shadow:0 0 0 3px rgba(22,163,74,.2)}
[data-tone="part"] i{background:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.22)}
[data-tone="bad"] i{background:#ef4444;box-shadow:0 0 0 3px rgba(239,68,68,.22)}
@media(hover:hover){.status-dot:hover,.side-status:hover{background:var(--fill)}}
.search-btn{margin-left:auto;display:inline-flex;align-items:center;gap:8px;min-width:44px;min-height:44px;padding:0 12px;border:1px solid transparent;border-radius:var(--pill);background:transparent;color:var(--ink2);transition:background var(--t),border-color var(--t)}
.search-btn .sb-tx,.search-btn kbd{display:none}
@media(hover:hover){.search-btn:hover{background:var(--fill)}}
@media(min-width:600px){.search-btn{min-width:260px;background:var(--card);border-color:var(--line-strong)}.search-btn .sb-tx{display:inline;flex:1;text-align:left;font-size:var(--fs-2)}}
@media(min-width:1100px){
  .app{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr)}
  .topbar .logo{display:none}
  .topbar-inner{gap:16px}
  .search-btn{order:-1;margin-left:0;flex:0 1 640px;height:48px;border-radius:var(--r-card);padding:0 16px;box-shadow:var(--shadow)}
  .search-btn kbd{display:inline-flex}
  .status-dot{margin-left:auto}
}
/* 탭: 폰·폴드는 아래 막대, PC 는 왼쪽 사이드바 */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;height:calc(var(--tab-h) + env(safe-area-inset-bottom));padding:0 4px env(safe-area-inset-bottom);background:var(--tabbar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line)}
.tabs button[data-tab]{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:44px;min-height:44px;border:0;background:transparent;color:var(--ink3);font-size:var(--fs-1);font-weight:600;transition:color var(--t)}
.tabs button[data-tab] .ic{width:24px;height:24px}
.tabs button.on{color:var(--pri-text)}
.tabs button.on .ic{stroke-width:2}
.side-logo,.side-status{display:none}
@media(min-width:1100px){
  .tabs{position:sticky;top:0;height:100vh;flex-direction:column;justify-content:flex-start;gap:4px;padding:16px 12px;border-top:0;border-right:1px solid var(--line);background:var(--card);backdrop-filter:none;-webkit-backdrop-filter:none}
  .side-logo{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;margin:0 0 20px}
  .tabs button[data-tab]{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;height:44px;padding:0 12px;border-radius:var(--r-sm);font-size:var(--fs-3);color:var(--ink2);transition:background var(--t),color var(--t)}
  .tabs button[data-tab] .ic{width:20px;height:20px}
  .tabs button.on{background:var(--pri-soft);color:var(--pri-text);font-weight:700}
  .side-status{display:flex;margin-top:auto;justify-content:flex-start;border-radius:var(--r-sm);padding:0 12px;overflow:hidden;text-overflow:ellipsis}
  .status-dot{display:none}
}
@media(min-width:1100px) and (hover:hover){.tabs button[data-tab]:not(.on):hover{background:var(--fill);color:var(--ink)}}
main{padding:16px var(--gutter) calc(var(--tab-h) + 32px + env(safe-area-inset-bottom));min-width:0}
@media(min-width:1100px){main{padding:24px var(--gutter) 48px}}
body[data-tab="set"]:has(.diy-bar:not([hidden])) main{padding-bottom:calc(var(--tab-h) + 104px + env(safe-area-inset-bottom))}
.view{display:none}.view.on{display:block;animation:vin .18s var(--ease)}
@keyframes vin{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
.view-head{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;margin:0 0 16px}
.view-head .seg{flex:0 1 auto;max-width:100%;overflow-x:auto;scrollbar-width:none}
@media(max-width:599px){.view-head .seg button{padding:0 10px;font-size:var(--fs-2)}}
.view-head>.btn{margin-left:auto}
.view-title{margin:0;font-size:var(--fs-5);font-weight:700;letter-spacing:-.02em}
.back-btn{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 12px 0 4px;border:0;border-radius:var(--pill);background:transparent;color:var(--ink2);font-weight:600}
@media(hover:hover){.back-btn:hover{background:var(--fill)}}
.asof{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:var(--pill);background:var(--fill);color:var(--ink2);font-size:var(--fs-1);font-weight:600;white-space:nowrap;flex:none}
.warn{color:var(--warn)}

/* ── 카드 ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:var(--pad);min-width:0;box-shadow:var(--shadow);overflow-wrap:break-word}
.card h2{margin:0;font-size:var(--fs-4);font-weight:700;letter-spacing:-.01em}
.card h2 small,.card-head small{margin-left:8px;font-size:var(--fs-2);font-weight:500;color:var(--ink2)}
.card h2 .ic{width:20px;height:20px;margin-right:8px;color:var(--pri-text);vertical-align:-4px}
.sub{margin:4px 0 12px;font-size:var(--fs-2);color:var(--ink3)}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;min-height:28px;flex-wrap:wrap}
.card-head .meta{margin:0;flex:none}
.head-acts{display:flex;gap:8px;align-items:center;flex:none;flex-wrap:wrap}
.lnk-more{display:inline-flex;align-items:center;gap:2px;min-height:44px;padding:0 4px 0 8px;border:0;border-radius:var(--pill);background:transparent;color:var(--pri-text);font-size:var(--fs-2);font-weight:600;text-decoration:none;white-space:nowrap}
.lnk-more .ic{width:16px;height:16px}
@media(hover:hover){.lnk-more:hover{background:var(--pri-soft)}}

/* ── 줄(상품·브랜드·관심·재료) ── */
.row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 0;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;color:inherit;text-decoration:none}
.card .row:first-of-type,.list .row:first-child{border-top:0}
.row:focus-visible{outline-offset:-2px;border-radius:var(--r-sm)}
.row .rk{flex:none;width:36px;font-size:var(--fs-4);font-weight:600;text-align:center;font-variant-numeric:tabular-nums}
.row .rk small{font-size:var(--fs-1);font-weight:400;color:var(--ink2)}
.row img,.row .noimg,.thumb{flex:none;width:48px;height:48px;border-radius:var(--r-sm);object-fit:contain;background:var(--img-well);border:1px solid var(--line)}
.noimg,span.thumb{background:var(--fill)}
.row .tx,.mrow .tx,.brow .tx,.yt-row .tx,.sitem .tx{flex:1;min-width:0}
.br{display:block;font-size:var(--fs-1);color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.br .tag{margin-right:8px}
.row .nm{font-size:var(--fs-3);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.pr{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:4px;font-size:var(--fs-2);color:var(--ink2);font-variant-numeric:tabular-nums}
.pr b{color:var(--ink);font-weight:600}
.pr .dc{color:var(--ink2);font-weight:600}
.pr s{color:var(--ink3)}
.row .side{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px;max-width:96px}
/* 넓은 줄(440px+)은 가격을 이름 밑이 아니라 오른쪽 칸으로 → 이름과 태그 사이가 비지 않게 */
.row{container:row/inline-size}
@container row (min-width:440px){
  .row .tx{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:16px;align-items:center}
  .row .tx>*{grid-column:1}
  .row .tx>.pr{grid-column:2;grid-row:1/span 4;margin-top:0;max-width:180px;justify-content:flex-end}
}

.val{font-size:var(--fs-2);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.nm1{display:block;font-size:var(--fs-3);font-weight:600;overflow-wrap:anywhere}
.meta{display:block;margin-top:4px;font-size:var(--fs-2);color:var(--ink2)}
.note{margin:12px 0 4px;font-size:var(--fs-2);color:var(--ink2)}
.brow{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:12px 0;border:0;border-top:1px solid var(--line);background:transparent;text-align:left}
.list .brow:first-of-type{border-top:0}
.brow .rk{flex:none;width:28px;font-size:var(--fs-4);font-weight:600;text-align:center;font-variant-numeric:tabular-nums}
.brow{container:brow/inline-size}
.brow .bscore{display:none}
@container brow (min-width:420px){.brow .tx{flex:0 0 42%}.brow .bscore{flex:1 1 0;display:flex;align-items:center;gap:8px;min-width:96px}.brow .bscore .nb-bar{flex:1}}   /* 넓은 줄: 이름 | 점수 막대 | 화살표 */
.brow .nm1 .ic{width:16px;height:16px;margin-left:4px;color:var(--ink2);vertical-align:-2px}
.wrow{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:8px 0;border:0;border-top:1px solid var(--line);background:transparent;text-align:left}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:var(--pill);border:1px solid var(--line-strong);background:var(--card);color:var(--ink);font-size:var(--fs-3);font-weight:600;white-space:nowrap;text-decoration:none;transition:background var(--t),border-color var(--t),color var(--t),box-shadow var(--t)}

.btn.danger{color:var(--bad)}

@media(hover:hover){.more:hover{background:var(--fill)}}

.chip{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border-radius:var(--pill);border:1px solid var(--line-strong);background:var(--card);font-size:var(--fs-3);color:var(--ink);white-space:nowrap;transition:background var(--t),color var(--t),border-color var(--t)}

    + tx(pl - 8, Y(TOP), 'end', TOP + (score ? '' : '위')) + tx(pl - 8, Y(BOT), 'end', BOT)

}

/* ── 키보드 (PC): ⌘K · Ctrl+K · / 검색, 1~6 탭, ↑↓(j/k) 목록 이동(트렌드 목록은 옆 칸 상세도 따라감), Enter 열기, Esc 닫기 ── */
document.addEventListener('keydown', function (e) {
  var t = e.target, typing = t && (/INPUT|TEXTAREA|SELECT/.test(t.tagName) || t.isContentEditable);
  if ((e.metaKey || e.ctrlKey) && !e.altKey && String(e.key).toLowerCase() === 'k') { e.preventDefault(); if (S.layers.indexOf('sr') === -1) openSearch(); else $('srQ').focus(); return; }
  if (typing) { if (t.id === 'srQ' && e.key === 'ArrowDown') { var f = document.querySelector('#srBody .sr-item'); if (f) { e.preventDefault(); f.focus(); } } return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === '/' && !S.layers.length) { e.preventDefault(); openSearch(); return; }
  if (/^[1-6]$/.test(e.key) && !S.layers.length) { route(TABS[+e.key - 1][0]); return; }
  var dn = e.key === 'ArrowDown' || e.key === 'j', up = e.key === 'ArrowUp' || e.key === 'k'; if (!dn && !up) return;
  var top = S.layers[S.layers.length - 1], scope = top === 'sr' ? $('srBody') : top ? $(top) : $(S.tab); if (!scope) return;
  var its = [].filter.call(scope.querySelectorAll('.dt-row.click, .row, .brow, .wrow, .menu-card, .sr-item, .pick-main, .rp-d'), function (x) { return x.offsetParent && x.getClientRects().length; });
  if (!its.length) return;
  var cur = its.indexOf(document.activeElement.closest ? document.activeElement.closest('.dt-row, .row, .brow, .wrow, .menu-card, .sr-item, .pick-main, .rp-d') : null), nx = its[Math.max(0, Math.min(its.length - 1, cur + (dn ? 1 : -1)))];
  if (cur === -1) nx = its[0];
  e.preventDefault(); nx.focus(); nx.scrollIntoView({ block: 'nearest' });
  if (nx.matches('.dt-row') && nx.closest('#rankList, #brandList') && canDock(nx.closest('#rankList') ? 'pd' : 'bs')) nx.click();
});

/* 시작은 맨 끝에서: 위의 S.set · S.pb 같은 값이 다 만들어진 뒤 */
if (google.script.url && google.script.url.getLocation) google.script.url.getLocation(function (loc) { S.k = (loc && loc.parameter && loc.parameter.k) || ''; start(); });
else start();
