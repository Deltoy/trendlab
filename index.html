<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>레디영 트렌드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>/* TRENDLAB — 디자인 토큰 (0927 디자인 정리: 색·글자·여백·모서리를 이 값들로만 쓴다) */
:root{color-scheme:light;
  --bg:#fafaf8;--card:#fff;--fill:#f5f5f5;--fill-2:#ececec;--line:#ececec;--line-strong:#e2e2df;
  --ink:#111;--ink2:#6b6b6b;--ink3:#737373;
  --up:#e0323c;--down:#1f6fd6;--up-ink:#c81e28;--up-soft:#fdecec;--down-ink:#1f63c4;--down-soft:#eaf1fc;
  --warn:#9a5b1f;--warn-soft:#f6ece0;--ok:#15803d;--ok-soft:#ecf7ef;--bad:#b42318;--bad-soft:#fee4e2;
  --cat-1:#2a78d6;--cat-2:#d4661f;--cat-3:#7a5bd6;--cat-4:#1f9e7a;--cat-other:#d1d5db;
  --fs-1:12px;--fs-2:13px;--fs-3:15px;--fs-4:17px;--fs-5:20px;--fs-6:24px;
  --r-mark:4px;--r-tag:8px;--r-sm:12px;--r-tile:14px;--r-card:20px;--pill:999px;
  --shadow:0 4px 24px rgba(0,0,0,.04);
  --gutter:24px;--pad:24px;
}
@media(max-width:899px){:root{--gutter:16px;--pad:16px}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:var(--fs-3);line-height:1.45;-webkit-font-smoothing:antialiased;word-break:keep-all}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.97)}
[hidden]{display:none!important}
img,svg,video,canvas{max-width:100%}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button:focus:not(:focus-visible){outline:none}
*{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:var(--pill)}
::-webkit-scrollbar-track{background:transparent}
.ic{flex:none;width:20px;height:20px;vertical-align:middle}

/* ── 상단 바 ── */
.topbar{position:sticky;top:0;z-index:20;background:rgba(250,250,248,.92);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.topbar-inner{display:flex;align-items:center;gap:24px;padding:8px var(--gutter);min-width:0}
.topbar-inner>*{min-width:0}
.logo{display:flex;align-items:center;gap:8px;flex:none}
.logo-mark{width:28px;height:28px;border-radius:var(--r-tag);background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:var(--fs-2)}
.logo-text{font-size:var(--fs-4);font-weight:800;letter-spacing:-.02em}
.owner-pill{display:inline-flex;align-items:center;gap:4px;padding:4px 12px 4px 8px;font-size:var(--fs-1);font-weight:600;color:var(--ink);border:1px solid transparent;border-radius:var(--pill);white-space:nowrap;
  background:linear-gradient(#fff,#fff) padding-box,linear-gradient(120deg,#f6d5d8,#d6ddd3 55%,var(--line-strong)) border-box}
.owner-pill .op-ic{width:14px;height:14px;color:#c08a91}
.owner-pill .op-org{color:var(--ink2);font-weight:400}
.owner-pill .op-dot{width:4px;height:4px;border-radius:50%;background:var(--line-strong)}
.owner-pill .op-name{font-weight:700}
@media(max-width:520px){.owner-pill .op-org,.owner-pill .op-dot{display:none}}
.tabs{display:flex;gap:4px;flex:1;justify-content:center;min-width:0;overflow-x:auto;scrollbar-width:none}
.tabs button{min-height:44px;border:0;background:transparent;border-bottom:2px solid transparent;font-size:var(--fs-3);color:var(--ink2);padding:0 12px;white-space:nowrap}
.tabs button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}
.topsearch-wrap{flex:0 1 260px;min-width:150px}
.topsearch{width:100%;height:44px;border:1px solid var(--line-strong);border-radius:var(--pill);padding:0 16px;font-size:16px;background:var(--card)}
.topsearch:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.status{margin:12px 0 0;padding:0 var(--gutter);font-size:var(--fs-2);color:var(--ink2)}
.status.bad{margin:12px var(--gutter) 0;padding:8px 16px;border-radius:var(--r-tile);background:var(--bad-soft);color:var(--bad);font-weight:600}
@media(min-width:900px) and (max-width:1279px){
  .topbar-inner{gap:12px}
  .tabs button{padding:0 8px}
  .owner-pill .op-org,.owner-pill .op-dot{display:none}
}
@media(min-width:900px) and (max-width:1079px){.owner-pill{display:none}.topsearch-wrap{flex-basis:200px}}
/* 폰: 탭은 아래, 검색은 헤더 한 줄 전체 */
@media(max-width:899px){
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;margin:0;background:#fff;box-shadow:0 -1px 0 var(--line);padding:0 8px env(safe-area-inset-bottom);justify-content:space-around}
  .tabs button{border-bottom:0;min-height:52px;font-size:var(--fs-2)}
  .tabs button.on{border-bottom:0}
  .topbar{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--bg)}
  .topbar-inner{flex-wrap:wrap;gap:8px 16px}
  .topsearch-wrap{flex:1 1 100%}
  .toast{bottom:calc(72px + env(safe-area-inset-bottom))}
}

/* ── 레이아웃: 왼쪽 필터(1024px+) + 본문 ── */
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;padding:16px var(--gutter) 80px}
@media(min-width:1024px){.layout{grid-template-columns:208px minmax(0,1fr)}body.not-home .layout{grid-template-columns:minmax(0,1fr)}}
@media(max-width:899px){.layout{padding:12px var(--gutter) calc(96px + env(safe-area-inset-bottom))}}
main,main>*{min-width:0}
.view{display:none}.view.on{display:block}
#home.on{display:flex;flex-direction:column;gap:16px}
#home>.step{margin-top:16px}
.filter-col{display:none}
.filter-mobile{display:flex;gap:8px;overflow-x:auto;margin:0 calc(-1 * var(--gutter));padding:0 var(--gutter) 8px}
.filter-mobile .chip{flex:none}
@media(min-width:1024px){
  .filter-mobile{display:none}
  .filter-col{display:block;position:sticky;top:76px;align-self:start;max-height:calc(100vh - 96px);overflow-y:auto}
}
body.not-home .filter-col,body.not-home .filter-mobile{display:none!important}
.filter-sec{margin-bottom:24px}
.filter-sec h3{margin:0 0 8px;font-size:var(--fs-1);font-weight:700;color:var(--ink3)}
.filter-cats{display:flex;flex-direction:column;gap:4px}
.filter-cat{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:44px;padding:0 12px;border:0;border-radius:var(--r-sm);background:transparent;font-size:var(--fs-2);color:var(--ink);text-align:left;transition:background .15s}
.filter-cat b{background:var(--fill);border-radius:var(--pill);padding:0 8px;font-size:var(--fs-1);font-weight:600;color:var(--ink2);font-variant-numeric:tabular-nums}
.filter-pills{display:flex;flex-wrap:wrap;gap:4px}
.filter-pills .chip{padding:0 12px;font-size:var(--fs-2)}
@media(hover:hover){.filter-cat:hover{background:var(--fill)}.filter-cat:hover b{background:var(--card)}}
.filter-err{margin:0;font-size:var(--fs-2);color:var(--ink2)}
/* 이 페이지에서: PC는 왼쪽 목록, 좁은 화면은 위 칩 줄 */
#step1,#step2,#step3,#step4,#step5{scroll-margin-top:16px}
.side-anchors,.chip-anchors{display:none}
@media(min-width:1024px){
  .side-anchors.show{display:block;border-top:1px solid var(--line);padding-top:16px}
  .side-anchors-title{margin:0 0 8px;font-size:var(--fs-1);font-weight:700;color:var(--ink3)}
  .side-anchors a{display:block;min-height:36px;line-height:36px;padding:0 4px;color:var(--ink2);text-decoration:none;font-size:var(--fs-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
}
@media(min-width:1024px) and (hover:hover){.side-anchors a:hover{color:var(--ink)}}
@media(max-width:1023px){
  #step1,#step2,#step3,#step4,#step5{scroll-margin-top:calc(var(--top-h,66px) + 100px)}
  .chip-anchors.show{display:flex;position:sticky;top:var(--top-h,66px);z-index:15;gap:8px;overflow-x:auto;white-space:nowrap;background:var(--bg);padding:8px var(--gutter);margin:0}
  .chip-anchors a{flex:none;min-height:44px;display:inline-flex;align-items:center;padding:0 16px;border-radius:var(--pill);border:1px solid var(--line-strong);background:var(--card);color:var(--ink);font-size:var(--fs-2);text-decoration:none}
}

/* ── 카드 · 단계 ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:var(--pad);min-width:0;box-shadow:var(--shadow);overflow-wrap:break-word}
.card h2{margin:0;font-size:var(--fs-4);font-weight:700;letter-spacing:-.01em}
.sub{margin:4px 0 12px;font-size:var(--fs-2);color:var(--ink3)}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:24px}
.card-head .meta{margin:0;flex:none}
.step{min-width:0;display:flex;flex-direction:column;gap:16px}
.step-head{display:flex;align-items:flex-start;gap:12px}
.step-num{flex:none;width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;font-size:var(--fs-2);font-weight:700;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.step-head-tx{min-width:0}
.step-head h2{margin:0;font-size:var(--fs-5);font-weight:700;letter-spacing:-.02em;line-height:28px}
.step-sub-line{margin:0;font-size:var(--fs-2);color:var(--ink3)}
.step2-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media(min-width:900px){.step2-grid{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}}
.step2-left,.step2-right{min-width:0}
.step2-right{display:flex;flex-direction:column;gap:16px}
.step5-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media(min-width:900px){.step5-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.move-body{margin-top:8px}
.step4-card{display:flex;align-items:center;justify-content:space-between;gap:12px 16px;flex-wrap:wrap}
.step4-card p{margin:0;color:var(--ink2);font-size:var(--fs-3)}
.step1-report .rp-head{margin:0 0 8px}
/* ③ 들여올 것 결정: 가격대 필터 + 2열 목록 */
.miss-bands{margin:0 0 8px}
.miss-bands button b{margin-left:4px;font-weight:600;font-variant-numeric:tabular-nums}
@media(max-width:899px){.miss-bands{display:flex;overflow-x:auto;scrollbar-width:none}.miss-bands::-webkit-scrollbar{display:none}.miss-bands button{flex:none}}
.miss-list{display:grid;grid-template-columns:minmax(0,1fr);column-gap:32px}
.miss-item{display:flex;align-items:center;gap:8px;min-width:0;border-top:1px solid var(--line)}
.miss-item .row{border-top:0;flex:1;min-width:0}
.miss-item:first-child{border-top:0}
@media(min-width:900px){.miss-list{grid-template-columns:repeat(2,minmax(0,1fr))}.miss-item:nth-child(2){border-top:0}.miss-more{display:none!important}}
@media(max-width:899px){.miss-list:not(.open) .miss-item:nth-child(n+6){display:none}}

/* ── 줄(상품·브랜드·관심·재료) ── */
.row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 0;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;color:inherit;text-decoration:none}
.card .row:first-of-type,.list .row:first-child{border-top:0}
.row:focus-visible{outline-offset:-2px;border-radius:var(--r-sm)}
.row .rk{flex:none;width:36px;font-size:var(--fs-4);font-weight:600;text-align:center;font-variant-numeric:tabular-nums}
.row .rk small{font-size:var(--fs-1);font-weight:400;color:var(--ink2)}
.row img,.row .noimg,.thumb{flex:none;width:48px;height:48px;border-radius:var(--r-sm);object-fit:contain;background:#fff;border:1px solid var(--line)}
.noimg,span.thumb{background:var(--fill)}
.row .tx,.mrow .tx,.brow .tx,.yt-row .tx,.sitem .tx{flex:1;min-width:0}
.br{display:block;font-size:var(--fs-1);color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.br .tag{margin-right:8px}
.row .nm{font-size:var(--fs-3);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
#rankList .nm{-webkit-line-clamp:1}
.pr{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:4px;font-size:var(--fs-2);color:var(--ink2);font-variant-numeric:tabular-nums}
.pr b{color:var(--ink);font-weight:600}
.pr .dc{color:var(--ink2);font-weight:600}
.pr s{color:var(--ink3)}
.row .side{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px;max-width:96px}
.val{font-size:var(--fs-2);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.nm1{display:block;font-size:var(--fs-3);font-weight:600;overflow-wrap:anywhere}
.meta{display:block;margin-top:4px;font-size:var(--fs-2);color:var(--ink2)}
.note{margin:12px 0 4px;font-size:var(--fs-2);color:var(--ink2)}
.brow{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:12px 0;border:0;border-top:1px solid var(--line);background:transparent;text-align:left}
.list .brow:first-of-type{border-top:0}
.brow .rk{flex:none;width:28px;font-size:var(--fs-4);font-weight:600;text-align:center;font-variant-numeric:tabular-nums}
.brow .nm1 .ic{width:16px;height:16px;margin-left:4px;color:var(--ink2);vertical-align:-2px}
.wrow{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:8px 0;border:0;border-top:1px solid var(--line);background:transparent;text-align:left}
.card .wrow:first-of-type{border-top:0}
.wtx{flex:1;min-width:0}
.wtx .nm1{font-weight:400;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.wch{flex:none;max-width:48%;text-align:right;font-size:var(--fs-2);font-weight:600;color:var(--ink2)}
.wch.up{color:var(--up-ink)}.wch.down{color:var(--down-ink)}.wch.sale{color:var(--warn)}
.mrow{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:12px 0;border:0;border-top:1px solid var(--line);background:transparent;text-align:left}
.card .mrow:first-of-type{border-top:0}
.mrow .side{flex:none;display:flex;color:var(--ink3)}
.lnk{border:0;background:transparent;padding:0;color:var(--ink2);font-size:var(--fs-2);min-height:44px;display:inline-flex;align-items:center;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:4px 16px;box-shadow:var(--shadow)}
.list.plain{background:none;padding:0;border-radius:0;border:0;box-shadow:none}
@media(min-width:900px){#rankList,#brandList{max-width:760px}}

/* ── 태그 (하나로 통일) ── */
.tag{display:inline-flex;align-items:center;flex:none;height:22px;padding:0 8px;border-radius:var(--pill);font-size:var(--fs-1);font-weight:600;font-style:normal;line-height:1;white-space:nowrap;vertical-align:middle;font-variant-numeric:tabular-nums}
.t-neutral{background:var(--fill);color:var(--ink2)}
.t-ink{background:var(--ink);color:#fff}
.t-up{background:var(--up-soft);color:var(--up-ink)}
.t-down{background:var(--down-soft);color:var(--down-ink)}
.t-warn{background:var(--warn-soft);color:var(--warn)}
.t-ok{background:var(--ok-soft);color:var(--ok)}

/* ── 버튼 · 칩 · 분절 토글 ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:var(--pill);border:1px solid var(--line-strong);background:var(--card);color:var(--ink);font-size:var(--fs-3);font-weight:600;white-space:nowrap;text-decoration:none}
.btn.pri,.btn.on{border-color:var(--ink);background:var(--ink);color:#fff}
.btn.danger{color:var(--bad)}

/* ── 빈 상태 · 불러오기 실패 (하나로 통일) ── */

/* ── 숫자 타일 (하나로 통일) ── */
.kpi-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}

.kpi{display:flex;flex-direction:column;gap:4px;min-width:0;padding:12px 16px;border-radius:var(--r-tile);background:var(--fill);color:var(--ink2);text-decoration:none}
a.kpi{min-height:44px}
.kpi-l{font-size:var(--fs-1);font-weight:600;color:var(--ink2)}
.kpi b{font-size:var(--fs-6);font-weight:700;color:var(--ink);letter-spacing:-.02em;line-height:1.2;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

@media(hover:hover){a.kpi:hover{background:var(--fill-2)}}
@media(max-width:412px){.kpi{padding:12px}.kpi b{font-size:var(--fs-5)}}
.flow{display:grid;margin-top:8px}

/* ── 창(시트) ── */
.dim{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.dim.on{opacity:1;pointer-events:auto}
.sheet{visibility:hidden;position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--card);border-radius:var(--r-card) var(--r-card) 0 0;max-height:92vh;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1),visibility 0s .25s;max-width:640px;margin:0 auto}
.sheet.on{transform:none;visibility:visible;transition-delay:0s}
@media(min-width:900px){
  .sheet{bottom:auto;top:50%;border-radius:var(--r-card);transform:translateY(-40%);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
  .sheet.on{transform:translateY(-50%);opacity:1;pointer-events:auto}
  #pd.sheet.on{transform:translateY(-48%)}
}
#bs{z-index:41}#bsDim{z-index:40}#pd{z-index:43}#pdDim{z-index:42}
.sheet-head{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}

.head-acts{display:flex;gap:8px;align-items:center;flex:none}

.sheet-body{flex:1;min-height:0;overflow:auto;padding:16px;overscroll-behavior:contain}
.sheet-foot{flex:none;display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sheet-foot .btn{flex:1}
.pd-top{display:flex;gap:16px;align-items:flex-start}
.pd-img{flex:none;display:block;border-radius:var(--r-tile)}
.pd-top img,.pd-top .noimg{flex:none;width:112px;height:112px;border-radius:var(--r-tile);object-fit:contain;border:1px solid var(--line);background:#fff}
.pd-top .noimg{background:var(--fill)}
.pd-top .br{font-size:var(--fs-2);white-space:normal}
.pd-top h3{margin:4px 0 8px;font-size:var(--fs-4);font-weight:700;line-height:1.35;overflow-wrap:anywhere}
.pd-name{color:inherit;text-decoration:none}.pd-name .ic{width:16px;height:16px;color:var(--ink2);vertical-align:-2px}
.pd-sec{margin-top:24px}
.pd-sec h4{margin:0 0 8px;font-size:var(--fs-3);font-weight:600;color:var(--ink2)}
.facts{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:4px;font-size:var(--fs-2);color:var(--ink2)}

.chart{max-width:440px}.chart svg{width:100%;height:auto;max-height:190px;display:block}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:var(--fs-1);color:var(--ink2);margin-top:4px}
.legend i{display:inline-block;width:12px;height:2px;border-radius:2px;vertical-align:middle;margin-right:4px}
.link-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:var(--fs-3)}
.link-row:first-child{border-top:0}

.link-q{font-size:var(--fs-3);margin:0 0 8px}
.field{display:block;margin-bottom:8px}
.field>span{display:block;font-size:var(--fs-2);color:var(--ink2);margin-bottom:4px}
.field textarea,.field input,.field select{width:100%;min-height:44px;border:1px solid var(--line-strong);border-radius:var(--r-tile);padding:8px 12px;font-size:16px;background:var(--card)}

.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

/* ── PC 옆 칸 상세 (1100px+, 랭킹·브랜드) ── */

}

@media(max-width:560px){.dn-row{grid-template-columns:12px minmax(60px,1fr) 60px 40px 64px}.dn-y{display:none}.dn-svg{width:200px;height:200px}}
.mix-key{display:flex;flex-wrap:wrap;gap:4px 12px;margin:0 0 8px;font-size:var(--fs-1);color:var(--ink2)}

.mix-bar i.fr{background:var(--cat-1);color:#fff}
.mix-bar i.out{background:#9ca3af}
.mix-bar i.loc{background:var(--cat-other)}
.stk-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:8px 0}
@media(max-width:699px){.stk-grid{grid-template-columns:minmax(0,1fr)}}
.stk-card{min-width:0;padding:12px;border-radius:var(--r-tile);background:var(--card);border:1px solid var(--line)}

/* 박스에 넣어 보기 */

  var head = '<div class="cmp-row cmp-head" style="grid-template-columns:minmax(96px,1.4fr) repeat(' + c.malls.length + ',minmax(34px,1fr))"><span>브랜드</span>' + c.malls.map(function (m) { return '<span title="' + esc(m.label + ' · ' + m.date) + '">' + esc(m.label.replace('올리브영 ', '').replace('올리브영', '올영')) + (m.abroad ? ' <em>해외</em>' : '') + '</span>'; }).join('') + '</div>';
  var rows = c.brands.map(function (b) {
    var t = CMP_TYPE[b.type] || ['', ''];
    return '<button type="button" class="cmp-row" data-b="' + esc(b.brand) + '" onclick="openBrand(this.dataset.b)" style="grid-template-columns:minmax(96px,1.4fr) repeat(' + c.malls.length + ',minmax(34px,1fr))"><span class="cmp-name">' + (t[0] ? '<span class="tag t-neutral" title="' + t[1] + ' 뜨는 브랜드">' + t[0] + '</span>' : '') + esc(b.brand) + (b.owned === true ? ' ' + tag('약국', 't-ok') : '') + '</span>'
      + c.malls.map(function (m) { var r = b.ranks[m.mall]; if (!r) return '<span class="cmp-cell none">·</span>'; var s = cmpShade(r); return '<span class="cmp-cell" style="background:' + s.bg + ';color:' + s.fg + '" title="' + esc(m.label + ' ' + r + '위 · ' + (b.counts[m.mall] || 1) + '개') + '">' + r + '</span>'; }).join('') + '</button>';
  }).join('');
  el.innerHTML = '<p class="note">칸 숫자 = 그 사이트에서 이 브랜드의 가장 높은 순위 (진할수록 상위) · 전역 3곳 이상 · 해외 해외에서만 · 국내 국내에서만</p><div class="cmp">' + head + rows + '</div>';
}
function setBrandView(v) { S.brand.view = v; if (v !== 'oy') undockSheet('bs'); [].forEach.call(document.querySelectorAll('#brandView button'), function (b) { var on = b.dataset.v === v; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); }); $('brandChips').hidden = v !== 'oy'; clearTimeout(S.bcTimer); $('brandList').classList.toggle('plain', v === 'find'); if (v === 'cmp') loadCompare(); else if (v === 'find') loadFind(); else loadBrands(); }
/* ── 브랜드 검색 (화해 전체 상품 + 우리 약국 보유) ── */
function safeUrl(u) { return /^https:\/\//.test(String(u || '')) ? u : ''; }
function loadFind() {
  S.bc = S.bc || { f: 'all', old: false };
  if (S.bc.res || S.bc.pending) { renderFind(); return; }
  $('brandList').innerHTML = skel(3);
  call('getBrandSearches', [], function (r) { S.bc.recent = r && r.ok ? r.items : []; if (S.brand.view === 'find') renderFind(); });
}
function findForm() {
  var q = S.bc.q || '';
  return '<form class="bc-form" onsubmit="event.preventDefault();bcSearch($(\'bcQ\').value)"><input id="bcQ" type="search" enterkeyhint="search" maxlength="30" placeholder="브랜드 이름 (예: 코나피딜)" aria-label="브랜드 이름" value="' + esc(q) + '"><button type="submit" class="btn pri">검색</button></form>'
    + '<p class="note">손님이 묻는 브랜드의 전체 상품을 화해에서 가져와, 우리 약국에 있는지 같이 보여줘요 · 한 번 찾은 브랜드는 7일 보관</p>';
}
function renderFind() {
  var b = S.bc, h = findForm();
  if (b.pending) h += '<div class="empty">맥이 화해에서 <b>' + esc(b.q) + '</b> 상품을 가져오는 중이에요 (보통 1~2분)' + (b.polls >= 40 ? '<br><b>10분이 지나도 결과가 없어요. 맥이 켜져 있는지 확인하고 다시 검색해 주세요</b>' : b.polls > 16 ? '<br><b>오래 걸리고 있어요 — 맥이 꺼져 있거나 잠자기 상태일 수 있어요</b>' : '') + '</div>';
  else if (b.res) h += findResult(b.res);
  else if (b.recent && b.recent.length) h += '<div class="bc-recent"><p class="sub">최근 찾은 브랜드</p><div class="grp-chips">' + b.recent.map(function (x) { return '<button type="button" class="chip" data-q="' + esc(x.q) + '" onclick="bcSearch(this.dataset.q)">' + esc(x.q) + (x.count ? ' · ' + x.count : '') + '</button>'; }).join('') + '</div></div>';
  $('brandList').innerHTML = h;
}
function findResult(r) {
  if (r.status === 'failed') return '<p class="empty">' + esc(r.msg || '가져오지 못했어요') + '</p><button type="button" class="btn pri block" data-q="' + esc(r.q) + '" onclick="bcSearch(this.dataset.q, true)">다시 가져오기</button>';
  if (r.status === 'empty') return '<p class="empty">' + esc(r.msg || '찾은 상품이 없어요') + ' · 다른 표기(영문 등)로도 찾아보세요</p>';
  var f = S.bc.f, live = r.items.filter(function (x) { return !x.obsolete; }), pool = S.bc.old ? r.items : live;
  var own = live.filter(function (x) { return x.owned; }).length, pct = live.length ? Math.round(own / live.length * 100) : 0;
  var list = pool.filter(function (x) { return f === 'all' || (f === 'none' ? !x.owned : x.owned); });
  var chip = function (k, lab) { return '<button type="button" class="chip' + (f === k ? ' on' : '') + '" aria-pressed="' + (f === k) + '" data-f="' + k + '" onclick="S.bc.f=this.dataset.f;renderFind()">' + lab + '</button>'; };
  return '<article class="card bc-head"><p class="meta">' + esc(shortDate(r.date)) + ' · 화해 기준</p><h2>' + esc(r.brand) + '</h2>'
    + '<div class="bc-stat"><span><b>' + live.length + '</b>판매 중</span><span><b>' + (r.logiOk ? own + '/' + live.length : '–') + '</b>우리 약국 보유</span><span><b>' + (r.items.length - live.length) + '</b>단종</span></div>'
    + (r.logiOk ? '<div class="bc-ratio" role="img" aria-label="보유 ' + pct + '%"><span style="width:' + pct + '%"></span></div><p class="sub">보유 ' + pct + '% · 나머지는 손님 문의 시 주문 검토 대상</p>' : '<p class="sub">물류앱을 읽지 못해 보유 여부는 알 수 없어요</p>')
    + (r.ours && r.ours.length ? '<details class="bc-ours"><summary>물류앱에 있는 ' + esc(r.brand.replace(/\s*\(.*\)/, '')) + ' 상품 ' + r.ours.length + '개</summary><ul>' + r.ours.map(function (n) { return '<li>' + esc(n) + '</li>'; }).join('') + '</ul></details>' : '')
    + '</article><div class="grp-chips bc-filter">' + chip('all', '전체') + chip('none', '우리 없음') + chip('own', '우리 있음')
    + '<button type="button" class="chip' + (S.bc.old ? ' on' : '') + '" aria-pressed="' + S.bc.old + '" data-f="old" onclick="S.bc.old=!S.bc.old;renderFind()">단종 포함</button></div>'
    + (list.length ? '<div class="list">' + list.map(bcRow).join('') + '</div>' : '<p class="empty">해당하는 상품이 없어요</p>');
}
function bcRow(x) {
  var u = safeUrl(x.url), img = safeUrl(x.img);
  var own = x.owned === true ? tag('약국 있음', 't-ok') : x.owned === false ? tag('우리 없음', 't-warn') : '';
  var inner = (img ? '<img class="thumb" src="' + esc(img) + '" alt="" loading="lazy">' : '<span class="thumb"></span>')
    + '<span class="tx"><span class="nm1">' + esc(x.name) + (x.obsolete ? ' ' + tag('단종') : '') + '</span><span class="meta">' + esc([x.capacity, x.price ? won(x.price) : '', x.rating ? '평점 ' + x.rating + ' (' + x.reviews + ')' : ''].filter(Boolean).join(' · ')) + (x.match ? '<br>물류앱: ' + esc(x.match) : '') + '</span></span><span class="side">' + own + '</span>';
  return u ? '<a class="row bc-row" href="' + esc(u) + '" target="_blank" rel="noopener">' + inner + '</a>' : '<div class="row bc-row">' + inner + '</div>';
}
function bcSearch(q, retry) {
  q = String(q || '').trim(); if (q.length < 2) { toast('브랜드 이름을 2글자 이상 넣어 주세요'); return; }
  S.bc.q = q; S.bc.res = null; S.bc.pending = false; S.bc.polls = 0; S.bc.f = 'all'; S.bc.old = false; clearTimeout(S.bcTimer);
  $('brandList').innerHTML = findForm() + '<p class="empty">찾는 중…</p>';
  bcPoll(retry);
}
function bcPoll(retry) {
  var q = S.bc.q;
  call('searchBrand', [q, !!retry], function (r) {
    if (S.brand.view !== 'find' || q !== S.bc.q) return;   // 그사이 다른 화면·다른 검색으로 바뀌었으면 버린다
    if (!r || !r.ok) { toast((r && r.msg) || '검색하지 못했어요'); S.bc.pending = false; renderFind(); return; }
    if (r.status === 'pending') { S.bc.pending = true; S.bc.polls = (S.bc.polls || 0) + 1; renderFind(); clearTimeout(S.bcTimer); if (S.bc.polls < 40 && S.brand.view === 'find') S.bcTimer = setTimeout(bcPoll, 15000); return; }
    if (r.status === 'failed') { S.bc.pending = false; S.bc.res = r; renderFind(); return; }
    S.bc.pending = false; S.bc.res = r; renderFind();
  });
}
/* ── 유튜브 쇼츠 (홈 ②) ── */
function viewsKo(n) { return n >= 10000 ? Math.round(n / 10000) + '만' : n >= 1000 ? (n / 1000).toFixed(1).replace(/\.0$/, '') + '천' : String(n); }
function loadYt() {
  if (S.yt) { renderYt(); return; }
  var fail = function () { if (!S.yt) failBox($('c-yt'), 'retryYt()'); };
  call('getYoutube', [], function (y) { if (!y || !y.ok) { fail(); return; } S.yt = y; renderYt(); }, fail);
}
function retryYt() { var el = $('c-yt'); if (!el) return; S.yt = null; el.innerHTML = SKL; skelWatch(el, 'retryYt()'); loadYt(); }
function renderYt() {
  var el = $('c-yt'), y = S.yt; step1Kpis(); if (!el) return;
  if (!y.total) { el.innerHTML = '<h2>유튜브 쇼츠</h2><p class="empty">최근 7일 인기 뷰티 쇼츠가 모이면 여기에 떠요</p>'; return; }
  el.innerHTML = '<h2>유튜브 쇼츠에서 뜨는 브랜드</h2><p class="sub">최근 7일 인기 뷰티 쇼츠 ' + y.total + '개 · 제목·태그에 나온 브랜드의 조회수 합</p>'
    + (y.brands.length ? vzBars(y.brands.slice(0, 6).map(function (b, i) { return { label: b.brand, value: b.views, text: viewsKo(b.views) + '회 · ' + b.videos + '편', yt: 'b' + i }; })) : '<p class="empty">아직 브랜드가 언급된 영상이 없어요</p>')
    + (y.items && y.items.length ? '<p class="sub yt-sub">뜨는 아이템 (영상 제목·태그 기준 조회수 합)</p>' + vzBars(y.items.slice(0, 6).map(function (x, i) { return { label: x.label, value: x.views, text: viewsKo(x.views) + '회 · ' + x.videos + '편', yt: 'i' + i }; })) : '')
    + '<p class="sub yt-sub">조회수 TOP 영상</p><div class="yt-list">' + y.videos.slice(0, 5).map(function (v) { return '<a class="yt-row" href="https://www.youtube.com/shorts/' + encodeURIComponent(v.id) + '" target="_blank" rel="noopener"><span class="yt-v">' + viewsKo(v.views) + '</span><span class="tx"><span class="nm1">' + esc(v.title) + '</span><span class="meta">' + esc(v.channel) + ' · ' + v.seconds + '초</span></span><span class="side">' + icon('ext') + '</span></a>'; }).join('') + '</div>';
}
/* 0927 뜨는 브랜드·아이템 누르면 그 쇼츠 바로 보기 (재료 창 재사용) */
function openShorts(ref) {
  var y = S.yt || {}, g = ref.charAt(0) === 'b' ? (y.brands || [])[+ref.slice(1)] : (y.items || [])[+ref.slice(1)]; if (!g) return;
  var name = g.brand && ref.charAt(0) === 'b' ? g.brand : g.label, vids = g.vids || [];
  $('mtTitle').textContent = name + ' 쇼츠';
  $('mtBody').innerHTML = vids.length ? '<p class="sub">최근 7일 · 조회수 높은 순 · 누르면 유튜브에서 바로 재생돼요</p><div class="sh-grid">' + vids.map(function (v) {
    return '<a class="sh-card" href="https://www.youtube.com/shorts/' + encodeURIComponent(v.id) + '" target="_blank" rel="noopener"><img src="https://i.ytimg.com/vi/' + encodeURIComponent(v.id) + '/hqdefault.jpg" alt="" loading="lazy" referrerpolicy="no-referrer"><span class="sh-v">' + viewsKo(v.views) + '회</span><span class="nm1">' + esc(v.title) + '</span><span class="meta">' + esc(v.channel || '') + (v.seconds ? ' · ' + v.seconds + '초' : '') + '</span></a>';
  }).join('') + '</div>' : '<p class="empty">서버를 새 버전으로 붙여넣으면 여기에 쇼츠가 떠요</p>';
  $('mtFoot').innerHTML = ref.charAt(0) === 'b' ? '<button type="button" class="btn" data-b="' + esc(g.brand) + '" onclick="closeMt();openBrand(this.dataset.b)">' + esc(g.brand) + ' 브랜드 보기</button>' : '';
  $('mtDim').classList.add('on'); $('mt').classList.add('on'); $('mt').setAttribute('aria-hidden', 'false'); layerOpen('mt');
}
function otherMallsHtml(list) {
  if (!list || !list.length) return '';
  return '<div class="pd-sec"><h4>다른 사이트 순위</h4>' + list.map(function (x) { return '<div class="link-row"><span><b>' + esc(x.label) + '</b> ' + x.rank + '위 <small class="meta">' + esc(x.name) + '</small></span>' + (x.url && /^https:\/\//.test(x.url) ? '<a class="btn" href="' + esc(x.url) + '" target="_blank" rel="noopener">보기 ' + icon('ext') + '</a>' : '') + '</div>'; }).join('') + '</div>';
}
/* 0926 상품 사진 누르면 크게 (세트 DIY · 보유 세트 · 테스트 세트) */
document.addEventListener('click', function (e) {
  var img = e.target.closest && e.target.closest('.diy-img img, .ps-ph img, .ps-thumbs img'); if (!img || !img.src) return;
  var box = img.closest('.diy-row, .diy-it, .ps-card'), nm = box ? ((box.querySelector('.nm1, h3') || {}).textContent || '') : '';
  var z = $('imgZoom'); if (!z) { z = document.createElement('div'); z.id = 'imgZoom'; z.className = 'img-zoom'; z.setAttribute('role', 'dialog'); z.setAttribute('aria-label', '사진 크게 보기'); z.onclick = function () { z.hidden = true; }; document.body.appendChild(z); }
  z.innerHTML = '<figure><img src="' + esc(img.src) + '" alt="' + esc(nm) + '" referrerpolicy="no-referrer"><figcaption>' + esc(nm) + '</figcaption></figure><button type="button" class="img-zoom-x" aria-label="닫기">' + icon('x') + '</button>';
  z.hidden = false;
});
document.addEventListener('keydown', function (e) { var z = $('imgZoom'); if (e.key === 'Escape' && z && !z.hidden) z.hidden = true; });

/* 0927 창을 오래 열어 둔 채 다시 보면 상태 띠(수집 성공/실패)가 옛날 것 → 20분 넘었으면 새로 받기 */
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && S.homeAt && Date.now() - S.homeAt > 20 * 60 * 1000) loadHome(); });
/* 0927 트랙패드로 확대(핀치)된 채면 페이지 오른쪽이 잘려 보이고 Cmd+0 으로도 안 풀린다 → 한 번 알려준다 */
(function () {
  if (!window.visualViewport || !matchMedia('(pointer:fine)').matches) return;
  var said = 0, chk = function () { if (!said && visualViewport.scale > 1.05) { said = 1; toast('화면이 확대돼 있어요 · 트랙패드에서 두 손가락을 오므리면 원래대로 돌아와요'); } };
  visualViewport.addEventListener('resize', chk); setTimeout(chk, 1500);
})();
</script>
